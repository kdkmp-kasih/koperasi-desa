<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V40 NAV RESPONSIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<style>
html{scroll-behavior:smooth}
/* HP: 2-3 baris, kotak besar. Laptop: 1 baris */
#navHari{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}
#navHari button{
  width:32px;
  height:32px;
  font-size:12px;
  border-radius:8px;
}
@media(min-width:1024px){
  #navHari{
    flex-wrap:nowrap;
    gap:3px;
  }
  #navHari button{
    width:28px;
    height:28px;
    font-size:10px;
    border-radius:6px;
  }
}
</style>
</head>
<body class="bg-[#fef2f2]">
<div class="bg-[#BE1E2D] text-white sticky top-0 z-50 shadow-lg">
<div class="max-w-6xl mx-auto p-2">

<div class="flex justify-between items-center gap-2">
<div class="flex-1 min-w-0">
<h1 class="font-bold text-[11px] md:text-[12px] truncate">🇮🇩 KDKMP KASIH V40 - NAV RESPONSIVE</h1>
<p id="tgl" class="text-[8px] text-yellow-200 truncate"></p>
</div>
<div class="flex items-center gap-2 shrink-0">
<div class="text-right hidden sm:block">
<div class="w-20 h-2 bg-white/30 rounded-full"><div id="bar" class="h-2 bg-white rounded-full" style="width:0%"></div></div>
<p id="txt" class="text-[8px] font-bold">0%</p>
</div>
<div class="flex gap-1">
<button id="tab1" onclick="switchTab(1)" class="px-3 py-1.5 rounded-md text-[9px] font-bold bg-white text-[#BE1E2D]">1-31</button>
<button id="tab2" onclick="switchTab(2)" class="px-3 py-1.5 rounded-md text-[9px] font-bold bg-black/20 text-white">TUNG<span id="badgeTunggakan" class="hidden bg-yellow-300 text-black px-1 rounded-full text-[7px] ml-1">0</span></button>
<button id="tab3" onclick="switchTab(3)" class="px-3 py-1.5 rounded-md text-[9px] font-bold bg-black/20 text-white">TTD</button>
</div>
</div>
</div>

<!-- NAV RESPONSIVE -->
<div class="mt-2 bg-white rounded-xl p-2.5 shadow">
<div class="flex justify-between items-center mb-2">
<p class="text-[10px] font-bold text-[#BE1E2D]">📍 NAV 1-31 (HP: besar 2 baris, Laptop: 1 baris) - Klik loncat:</p>
<div class="flex items-center gap-2">
<div class="sm:hidden w-16 h-1.5 bg-white/50 rounded-full border"><div id="barMobile" class="h-1.5 bg-[#BE1E2D] rounded-full" style="width:0%"></div></div>
<span class="text-[8px] text-slate-500">🔴 HariIni</span>
</div>
</div>
<div id="navHari"></div>
</div>

</div>
</div>

<div id="explainModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-3">
<div class="bg-white rounded-xl max-w-md w-full"><div class="bg-[#BE1E2D] text-white p-3 flex justify-between"><div><p id="modalTitle" class="font-bold text-[12px]"></p><p id="modalSub" class="text-[9px]"></p></div><button onclick="closeExplain()" class="bg-white/20 w-6 h-6 rounded-full">X</button></div><div id="modalContent" class="p-3 space-y-2 text-[11px]"></div><div class="p-2 border-t flex gap-2"><button onclick="closeExplain()" class="flex-1 bg-slate-100 py-2 rounded">Tutup</button><button onclick="copyExplain()" class="flex-1 bg-[#BE1E2D] text-white py-2 rounded">Copy</button></div></div>
</div>

<div class="max-w-6xl mx-auto p-2 space-y-2">
<div id="content1"><div id="container1" class="grid gap-2"></div></div>
<div id="content2" class="hidden"><div id="container2" class="grid gap-2"></div></div>
<div id="content3" class="hidden"><div class="bg-white border rounded p-3"><p class="font-bold text-[11px]">TTD + CAP</p><div class="grid grid-cols-2 gap-2 mt-2"><div class="border p-2 rounded"><p class="text-[9px] font-bold">Kades</p><input id="namaKades" placeholder="Nama" class="w-full border rounded p-1 text-[9px] mt-1" oninput="localStorage.setItem('namaKades',this.value)"></div><div class="border p-2 rounded"><p class="text-[9px] font-bold">Manajer</p><input id="namaManajer" placeholder="Nama" class="w-full border rounded p-1 text-[9px] mt-1" oninput="localStorage.setItem('namaManajer',this.value)"></div></div></div></div>
</div>

<script>
let currentExplainText="";
const baseDays=[
{d:1,t:"Laporan Diri Tingkat Desa",m:"DESA",tasks:["Melaporkan keberadaan kepada Kepala Desa","Melaporkan kepada Lurah","Serah terima penugasan kepada Pengurus","Perkenalkan diri sebagai Manajer","Catat kontak Kades","Melaporkan kepada Babinsa","Catat kontak babinsa","Catat kontak ketua pengurus"]},
{d:2,t:"Silaturahmi",m:"DESA",tasks:["Silaturahmi Ketua BPD","Silaturahmi Anggota BPD","Silaturahmi Tokoh Masyarakat","Silaturahmi Ketua RT","Silaturahmi Ketua RW","Sampaikan visi inklusif","Sampaikan visi kolaboratif","Sampaikan visi transparan","Catat aspirasi"]},
{d:3,t:"Inventarisasi Aset",m:"GERAI",tasks:["Periksa kantor koperasi","Catat ukuran kantor","Periksa mesin/peralatan","Catat kondisi mesin","Periksa persediaan barang","Catat stok barang","Foto aset untuk BAST"]},
{d:4,t:"Audit Administrasi",m:"RUMAH",tasks:["Periksa dokumen legalitas","Periksa buku rekening bank","Periksa arsip keuangan","Test login SIMKOPDES","Pastikan SIMKOPDES lancar"]},
{d:5,t:"Pemetaan Anggota",m:"RUMAH",tasks:["Kumpulkan data anggota aktif","Kumpulkan data anggota pasif","Data calon anggota potensial","Rekap jumlah anggota","Siapkan untuk input SIMKOPDES"]},
{d:6,t:"Pemetaan Ekonomi",m:"RUMAH",tasks:["Tinjau data Desil wilayah","Identifikasi kelompok sasaran","Petakan potensi ekonomi","Catat kelompok tani/nelayan"]},
{d:7,t:"BAST Minggu 1",m:"RUMAH",tasks:["Susun BAST Aset","Susun Pemetaan Awal","Kirim laporan Minggu 1 ke Kades"]},
{d:8,t:"SIMKOPDES Anggota",m:"RUMAH",tasks:["Input data keanggotaan","Update data keanggotaan","Input profil KDKMP","Verifikasi NIK"]},
{d:9,t:"SIMKOPDES Keuangan",m:"RUMAH",tasks:["Tata alur pembukuan","Sesuaikan dengan standar SIMKOPDES","Input saldo kas","Input saldo bank"]},
{d:10,t:"Integrasi Privy",m:"RUMAH",tasks:["Pastikan ttd dokumen terintegrasi","Pastikan kontrak terintegrasi Privy","Uji coba Privy"]},
{d:11,t:"SOP Kas",m:"RUMAH",tasks:["Susun SOP kas kecil","Susun SOP penerimaan","Susun SOP laporan harian"]},
{d:12,t:"SOP Pelayanan & Stok",m:"RUMAH",tasks:["SOP pendaftaran anggota baru","SOP simpanan","SOP prosedur pengajuan","SOP pengelolaan stok","SOP perdagangan/waserda"]},
{d:13,t:"Persiapan Rapat",m:"RUMAH",tasks:["Siapkan materi pemetaan","Siapkan draf SOP","Buat undangan Pengurus","Buat undangan Pengawas"]},
{d:14,t:"Rapat Konsolidasi",m:"DESA",tasks:["Presentasi pemetaan ke Pengurus","Presentasi SOP ke Pengawas","Sepakati Q1 Targets","Deliverable SIMKOPDES & SOP"]},
{d:15,t:"Quick Win Sembako",m:"RUMAH",tasks:["Tentukan Quick Win","Daftar kebutuhan pokok","Cek harga bersaing","Koordinasi 1 pintu Agrinas"]},
{d:16,t:"Quick Win Pertanian & PPOB",m:"RUMAH",tasks:["Data kebutuhan pupuk","Data kebutuhan pakan","Data kebutuhan bibit","Layanan listrik","Layanan air","Layanan BPJS"]},
{d:17,t:"Pencatatan Real-time",m:"GERAI",tasks:["Catat transaksi Quick Win real-time","Cek stok harian","Cek kas harian"]},
{d:18,t:"Sosialisasi Forum",m:"DESA",tasks:["Sosialisasi rembug warga","Sosialisasi pengajian","Sosialisasi RWT/RTL"]},
{d:19,t:"Edukasi Keanggotaan",m:"DESA",tasks:["Jelaskan hak anggota","Jelaskan kewajiban","Jelaskan keuntungan","Jelaskan SHU","Jelaskan akses usaha"]},
{d:20,t:"Posko Pendaftaran",m:"DESA",tasks:["Buka posko pendaftaran","Tentukan lokasi strategis","Bagi formulir","Catat calon anggota"]},
{d:21,t:"Deliverable Minggu 3",m:"GERAI",tasks:["Evaluasi layanan Quick Win","Hitung anggota baru","Laporan Minggu 3"]},
{d:22,t:"Reconcile",m:"RUMAH",tasks:["Cocokkan kas fisik","Cocokkan rekening bank","Cocokkan SIMKOPDES","Catat selisih"]},
{d:23,t:"Laporan Keuangan",m:"RUMAH",tasks:["Susun Laba/Rugi","Susun Neraca Kas","Susun Perkembangan Anggota"]},
{d:24,t:"Analisis",m:"RUMAH",tasks:["Analisis omzet","Analisis margin","Analisis animo warga"]},
{d:25,t:"Persiapan Eksternal",m:"RUMAH",tasks:["Siapkan Laporan Kinerja Manajer","Siapkan data Dinkop","Siapkan data Kementerian"]},
{d:26,t:"Pelaporan Eksternal",m:"RUMAH",tasks:["Kirim ke Dinkop","Kirim ke Kementerian","Hubungi Pendamping","Hubungi Pembina"]},
{d:27,t:"Diskusi",m:"RUMAH",tasks:["Diskusi dengan Pendamping","Catat masukan","Catat arahan"]},
{d:28,t:"Persiapan Evaluasi",m:"RUMAH",tasks:["Siapkan materi evaluasi","Daftar capaian","Daftar kendala"]},
{d:29,t:"Rapat Evaluasi",m:"DESA",tasks:["Rapat dengan Pengurus","Bahasa capaian 30 hari","Catat masukan"]},
{d:30,t:"Rencana Bulan 2",m:"RUMAH",tasks:["Susun Rencana Bulan 2","Fokus unit usaha baru","Rencana kemitraan","Rencana permodalan","Finalisasi Laporan Resmi","Finalisasi Master Plan","Export untuk Kades","Export untuk Korwil","Export untuk Dinas"]},
{d:31,t:"Evaluasi Akhir Bulan",m:"DESA",tasks:["Evaluasi total 30 hari","Laporan akhir ke Kades","Rencana Bulan 2","Tutup buku bulan 1"]}
];
const EXPLANATIONS={"Melaporkan keberadaan kepada Kepala Desa":{maksud:"Lapor resmi mulai tugas",tujuan:"Agar Kades mendukung",cara:"Bawa SK, datang ke balai, foto buku tamu"}};
function getStart(){const s=localStorage.getItem('kdkmp_startDate'); if(s) return new Date(s); const n=new Date(); n.setHours(0,0,0,0); return n;}
function getHariIni(){const s=getStart(); const now=new Date(); now.setHours(0,0,0,0); return Math.max(1,Math.floor((now-s)/86400000)+1);}
function isChecked(d,i){return localStorage.getItem('chk_'+d+'_'+i)==='1' || localStorage.getItem('v28_'+d+'_'+i)==='1';}
function switchTab(n){document.getElementById('content1').classList.toggle('hidden',n!==1); document.getElementById('content2').classList.toggle('hidden',n!==2); document.getElementById('content3').classList.toggle('hidden',n!==3); ['tab1','tab2','tab3'].forEach((id,i)=>{const el=document.getElementById(id); el.className=(i+1===n?'bg-white text-[#BE1E2D] shadow':'bg-black/20 text-white')+' px-3 py-1.5 rounded-md text-[9px] font-bold';});}
function scrollToHari(d){
  switchTab(1);
  setTimeout(()=>{
    const el=document.getElementById('hari-'+d);
    if(el){
      const y=el.getBoundingClientRect().top + window.pageYOffset - 160;
      window.scrollTo({top:y, behavior:'smooth'});
      el.classList.add('ring-4','ring-yellow-400');
      setTimeout(()=>el.classList.remove('ring-4','ring-yellow-400'),1500);
    }
  },100);
}
function showExplain(d,i){
  const t=baseDays.find(x=>x.d===d).tasks[i];
  const e=EXPLANATIONS[t]||{maksud:"Tugas Hari "+d,tujuan:"Target 30 hari",cara:"Kerjakan sesuai SOP"};
  document.getElementById('modalTitle').textContent=t;
  document.getElementById('modalSub').textContent="Hari "+d;
  document.getElementById('modalContent').innerHTML="<div class='bg-blue-50 border-l-4 border-blue-500 p-2 rounded'><b>MAKSUD:</b> "+e.maksud+"</div><div class='bg-green-50 border-l-4 border-green-500 p-2 rounded'><b>TUJUAN:</b> "+e.tujuan+"</div><div class='bg-amber-50 border-l-4 border-amber-500 p-2 rounded'><b>CARA:</b> "+e.cara+"</div>";
  currentExplainText=t;
  document.getElementById('explainModal').classList.remove('hidden');
}
function closeExplain(){document.getElementById('explainModal').classList.add('hidden');}
function copyExplain(){navigator.clipboard.writeText(currentExplainText).then(()=>alert('Dicopy'));}
function render(){
  const start=getStart(); const hariIni=getHariIni();
  document.getElementById('tgl').textContent="Start: "+start.toLocaleDateString('id-ID')+" | Hari ke-"+hariIni;
  let total=0,done=0; baseDays.forEach(d=>{total+=d.tasks.length; d.tasks.forEach((_,i)=>{if(isChecked(d.d,i)) done++;});});
  const persen=total?Math.round(done/total*100):0;
  document.getElementById('bar').style.width=persen+"%";
  document.getElementById('txt').textContent=persen+"%";
  const barM=document.getElementById('barMobile'); if(barM) barM.style.width=persen+"%";
  
  const nav=document.getElementById('navHari'); nav.innerHTML="";
  for(let i=1;i<=31;i++){
    const allDone=baseDays.find(d=>d.d===i)?.tasks.every((_,idx)=>isChecked(i,idx));
    const isToday=i===hariIni;
    const btn=document.createElement('button');
    btn.textContent=i;
    btn.className="font-bold border shadow-sm flex items-center justify-center shrink-0 transition "+(isToday?"bg-[#BE1E2D] text-white ring-2 ring-yellow-300 animate-pulse":allDone?"bg-green-500 text-white":"bg-white text-slate-700 hover:bg-slate-50");
    btn.onclick=()=>scrollToHari(i);
    nav.appendChild(btn);
  }

  const c1=document.getElementById('container1'); c1.innerHTML="";
  baseDays.forEach(day=>{
    const div=document.createElement('div'); div.id="hari-"+day.d;
    div.className="bg-white p-2.5 rounded-xl border "+(day.d===hariIni?"ring-2 ring-[#BE1E2D]":"");
    let html="<div class='flex justify-between mb-1.5'><p class='font-bold text-[11px]'>"+(day.d===hariIni?"👉 ":"")+"HARI "+day.d+": "+day.t+"</p><span class='text-[8px] px-1.5 py-0.5 rounded bg-slate-100'>"+day.m+"</span></div><div class='border rounded overflow-hidden'>";
    day.tasks.forEach((t,i)=>{
      const chk=isChecked(day.d,i);
      html+="<div class='flex items-center gap-1.5 py-2 px-2 border-b "+(chk?"bg-green-50":"")+"'><input type='checkbox' data-day='"+day.d+"' data-idx='"+i+"' "+(chk?"checked":"")+" class='w-4 h-4 accent-[#BE1E2D]'><span class='flex-1 text-[10px] "+(chk?"line-through text-slate-400":"")+"'>"+t+"</span><button onclick='showExplain("+day.d+","+i+")' class='bg-blue-50 text-blue-600 border px-1.5 py-0.5 rounded-full text-[8px] font-bold'>❓</button></div>";
    });
    html+="</div>";
    div.innerHTML=html;
    c1.appendChild(div);
  });

  const c2=document.getElementById('container2'); c2.innerHTML="";
  let tung=0; baseDays.forEach(d=>{if(d.d<hariIni) d.tasks.forEach((_,i)=>{if(!isChecked(d.d,i)) tung++;});});
  const badge=document.getElementById('badgeTunggakan'); badge.textContent=tung; if(tung>0) badge.classList.remove('hidden'); else badge.classList.add('hidden');
  if(tung>0){
    baseDays.filter(d=>d.d<hariIni).forEach(day=>{
      let html=""; let has=false;
      day.tasks.forEach((t,i)=>{if(!isChecked(day.d,i)){has=true; html+="<div class='flex gap-2 py-2 px-2 border-b'><span class='flex-1 text-[10px]'>"+t+"</span><button onclick='scrollToHari("+day.d+")' class='bg-[#BE1E2D] text-white px-2 py-1 rounded text-[8px]'>Ke "+day.d+"</button></div>";}});
      if(has){const div=document.createElement('div'); div.className="bg-white p-2.5 rounded border-l-4 border-[#BE1E2D]"; div.innerHTML="<p class='font-bold text-[10px] text-[#BE1E2D]'>HARI "+day.d+": "+day.t+"</p><div class='border rounded mt-1'>"+html+"</div>"; c2.appendChild(div);}
    });
  }

  document.querySelectorAll('#container1 input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',e=>{
      localStorage.setItem('chk_'+e.target.dataset.day+'_'+e.target.dataset.idx, e.target.checked?'1':'0');
      localStorage.setItem('v28_'+e.target.dataset.day+'_'+e.target.dataset.idx, e.target.checked?'1':'0');
      render();
    });
  });
}
render();
</script>
</body>
</html>
