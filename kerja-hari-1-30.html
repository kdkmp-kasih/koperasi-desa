<body class="bg-[#fef2f2]">

<div><h1 class="font-bold text-[12px]">🇮🇩 KDKMP KASIH V35 FIX - PENJELASAN ✅</h1><p id="tgl" class="text-[9px] font-bold text-yellow-200 mt-1"></p></div>

<div id="content2" class="hidden"><div id="container2" class="grid gap-3"></div><div id="analisisTunggakan" class="mt-4 bg-white border-2 border-[#BE1E2D] rounded-xl p-4"><p class="font-bold text-[13px] text-[#BE1E2D]">📊 ANALISIS</p><div id="analisisContent" class="mt-3 text-[11px]"></div></div></div>
<div id="content3" class="hidden space-y-3"><div class="bg-white border-2 border-[#BE1E2D] p-4 rounded-xl"><p class="font-bold text-[13px] text-[#BE1E2D]">TTD + CAP + NAMA</p><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3"><div class="border-2 border-orange-300 p-3 rounded-xl bg-orange-50"><p class="font-bold text-[11px]">BLOK KADES</p><div class="grid grid-cols-2 gap-2 mt-2"><div class="bg-white p-2 rounded border"><p class="text-[10px] font-bold">TTD Kades</p><input id="namaKades" placeholder="Nama Kades" class="w-full border rounded p-1 text-[10px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'ttdKades')"><img id="prevKades" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px] flex gap-1 mt-1"><input type="checkbox" id="needKades" checked onchange="saveNeed()"> Tampilkan</label></div><div class="bg-white p-2 rounded border"><p class="text-[10px] font-bold">Cap Kades</p><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'capKades')"><img id="prevCapKades" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px] flex gap-1 mt-1"><input type="checkbox" id="needCapKades" checked onchange="saveNeed()"> Tampilkan</label></div></div></div><div class="border-2 border-[#BE1E2D]/30 p-3 rounded-xl bg-red-50"><p class="font-bold text-[11px]">BLOK MANAJER</p><div class="grid grid-cols-2 gap-2 mt-2"><div class="bg-white p-2 rounded border"><p class="text-[10px] font-bold">TTD Manajer</p><input id="namaManajer" placeholder="Nama Manajer" class="w-full border rounded p-1 text-[10px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'ttdManajer')"><img id="prevManajer" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px] flex gap-1 mt-1"><input type="checkbox" id="needManajer" checked onchange="saveNeed()"> Tampilkan</label></div><div class="bg-white p-2 rounded border"><p class="text-[10px] font-bold">Cap KDKMP</p><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'capKoperasi')"><img id="prevCap" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px] flex gap-1 mt-1"><input type="checkbox" id="needCap" checked onchange="saveNeed()"> Tampilkan</label></div></div></div></div></div>

<button onclick="exportPDF(true)" class="bg-amber-600 text-white px-3 py-3 rounded-xl text-[11px] font-bold">⚠️ PDF TUNGGAKAN</button>

<script>
const { jsPDF } = window.jspdf;
let currentTab=1; let currentExplainText='';
const EXPLANATIONS = {
"Melaporkan keberadaan kepada Kepala Desa": {maksud:"Lapor ke Kades kalau kamu sudah resmi mulai tugas sebagai Manajer KDKMP Kasih.", tujuan:"Biar Kades mengakui, mendukung, kasih akses data desa & grup WA perangkat desa.", cara:"1. Bawa SK & KTP\\n2. Datang ke Balai Desa jam kerja\\n3. Sampaikan: Saya manajer KDKMP Kasih mulai hari ini\\n4. Minta buku tamu ditandatangani & foto\\n5. Catat no HP Kades"},
"Periksa kantor koperasi": {maksud:"Cek fisik gerai/kantor.", tujuan:"Tau kondisi layak atau perlu renovasi.", cara:"Foto 4 sisi, cek atap bocor, listrik, kunci."},
"Test login SIMKOPDES": {maksud:"Coba masuk aplikasi SIMKOPDES Kemenkop.", tujuan:"Pastikan akun manajer aktif. Semua laporan wajib via sini.", cara:"Buka simkopdes.kemenkop.go.id, login pakai NIK, jika error hubungi Pendamping."},
"Susun BAST Aset": {maksud:"Buat Berita Acara Serah Terima Aset.", tujuan:"Legalitas serah terima Desa ke Koperasi.", cara:"Template: Pada hari ini telah diserahkan... Daftar aset... TTD Kades, Ketua, Manajer."},
"Tentukan Quick Win": {maksud:"Pilih 1-2 program cepat hasil.", tujuan:"Biar warga langsung merasakan manfaat.", cara:"Pilih yang paling dibutuhkan: Sembako Murah."},
"Jelaskan SHU": {maksud:"Sisa Hasil Usaha = keuntungan koperasi dibagi ke anggota.", tujuan:"Motivasi jadi anggota.", cara:"Rumus: SHU dibagi berdasarkan belanja & simpanan."},
"Susun Rencana Bulan 2": {maksud:"Buat plan 30 hari ke depan.", tujuan:"Ada arah.", cara:"Tentukan: Bulan 2 fokus Simpan Pinjam & Pupuk."},
"Finalisasi Laporan Resmi": {maksud:"Laporan 30 hari final.", tujuan:"Disahkan.", cara:"Print, jilid, TTD Manajer, Ketua, Kades."}
};
function switchTab(n){currentTab=n; document.getElementById('content1').classList.toggle('hidden',n!==1); document.getElementById('content2').classList.toggle('hidden',n!==2); document.getElementById('content3').classList.toggle('hidden',n!==3); ['tab1','tab2','tab3'].forEach((id,i)=>{const active=(i+1===n); document.getElementById(id).className= active?'px-4 py-2 rounded-lg text-[11px] font-bold bg-white text-[#BE1E2D] shadow':'px-4 py-2 rounded-lg text-[11px] font-bold bg-black/20 text-white';}); render();}
function scrollToHari(d){ const el=document.getElementById('hari-'+d); if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); } switchTab(1); }
function getStoredStart(){return localStorage.getItem('kdkmp_startDate');}
function getStartDateObj(){const s=getStoredStart(); if(s){const d=new Date(s); d.setHours(0,0,0,0); return d;} const n=new Date(); n.setHours(0,0,0,0); return n;}
function getHariIni(){const start=getStartDateObj(); const now=new Date(); now.setHours(0,0,0,0); return Math.max(1, Math.floor((now-start)/86400000)+1);}
function setStartDate(val){ if(!val) return; const d = new Date(val); d.setHours(0,0,0,0); localStorage.setItem('kdkmp_startDate', d.toISOString()); render(); loadStartInput(); }
function setStartDateToday(){ const n=new Date(); n.setHours(0,0,0,0); localStorage.setItem('kdkmp_startDate', n.toISOString()); render(); loadStartInput(); }
function loadStartInput(){ const s=getStoredStart(); const el=document.getElementById('startDateInput'); if(s){ const d=new Date(s); const yyyy=d.getFullYear(); const mm=String(d.getMonth()+1).padStart(2,'0'); const dd=String(d.getDate()).padStart(2,'0'); el.value=`${yyyy}-${mm}-${dd}`; } else { el.value=''; } }
function saveNeed(){['Manajer','Kades','Cap','CapKades','CapKetua','Ketua','Pengawas'].forEach(k=>localStorage.setItem('need'+k,document.getElementById('need'+k).checked));}
function loadNeed(){['Manajer','Kades','Cap','CapKades','CapKetua','Ketua','Pengawas'].forEach(k=>{const v=localStorage.getItem('need'+k); if(v!==null) document.getElementById('need'+k).checked=v==='true'; else document.getElementById('need'+k).checked=(k==='Manajer'||k==='Kades'||k==='Cap'||k==='CapKades');});}
function saveNames(){['Manajer','Kades','Ketua','Pengawas'].forEach(k=>{const el=document.getElementById('nama'+k); if(el) localStorage.setItem('nama'+k,el.value);});}
function loadNames(){['Manajer','Kades','Ketua','Pengawas'].forEach(k=>{const v=localStorage.getItem('nama'+k); if(v!==null){const el=document.getElementById('nama'+k); if(el) el.value=v;} else if(k==='Kades'){document.getElementById('namaKades').value='Supriyadi'; localStorage.setItem('namaKades','Supriyadi');}});}
function saveImg(input,key){const f=input.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{localStorage.setItem(key,e.target.result); loadImgs();}; r.readAsDataURL(f);}
function loadImgs(){const map={'ttdManajer':'prevManajer','ttdKades':'prevKades','capKoperasi':'prevCap','capKades':'prevCapKades','capKetua':'prevCapKetua','ttdKetua':'prevKetua','ttdPengawas':'prevPengawas'}; Object.entries(map).forEach(([k,el])=>{const d=localStorage.getItem(k); const e=document.getElementById(el); if(d){e.src=d; e.classList.remove('hidden');} else if(e) e.classList.add('hidden');});}
function getFooterSetting(){ const active = localStorage.getItem('custom_footer_active'); const text = localStorage.getItem('custom_footer_text'); return {active: active===null? true : active==='true', text: text || `KDKMP Kasih V35 | {tanggal} | Hari ke-{hari}`}; }
function saveFooterSetting(){ localStorage.setItem('custom_footer_active', document.getElementById('needFooter').checked ? 'true' : 'false'); localStorage.setItem('custom_footer_text', document.getElementById('footerText').value); localStorage.setItem('custom_include_catatan', document.getElementById('includeCatatan').checked ? 'true' : 'false'); localStorage.setItem('custom_include_analisis', document.getElementById('includeAnalisisInPrint').checked ? 'true' : 'false'); updateFooterPreview(); }
function loadFooterSetting(){ const s = getFooterSetting(); const el1=document.getElementById('needFooter'); if(el1) el1.checked=s.active; const el2=document.getElementById('footerText'); if(el2) el2.value=s.text; updateFooterPreview(); }
function buildFooterText(){ const s = getFooterSetting(); if(!s.active) return null; let txt = s.text.trim(); const now = new Date().toLocaleString('id-ID'); const hariIni=getHariIni(); return txt.replace(/{tanggal}/g, now).replace(/{hari}/g, hariIni); }
function updateFooterPreview(){ const txt = buildFooterText(); const el=document.getElementById('footerPreview'); if(!el) return; el.textContent= txt? 'Preview: '+txt : 'Preview: (disembunyikan)'; }
loadNeed(); loadNames(); loadImgs(); loadStartInput(); loadFooterSetting();
  function showExplain(day, idx, isAdd){
  const taskDef = isAdd ? getAdded(day)[idx] : (baseDays.find(x=>x.d===day)?.tasks[idx] || '');
  const realText = isAdd ? taskDef : getText(day,idx,taskDef);
  const exp = EXPLANATIONS[realText] || {maksud:"Tugas lapangan Hari "+day+" sesuai SOP KDKMP.", tujuan:"Untuk mencapai target 30 hari KDKMP Kasih.", cara:"1. Siapkan alat/bahan.\\n2. Kerjakan sesuai SOP.\\n3. Dokumentasikan foto.\\n4. Catat di buku & SIMKOPDES.\\n5. Laporkan ke Pengurus/Kades."};
  document.getElementById('modalTitle').textContent = realText;
  document.getElementById('modalSub').textContent = `Hari ${day}`;
  document.getElementById('modalContent').innerHTML = `<div class="bg-blue-50 border-l-4 border-blue-500 p-3 rounded"><p class="font-bold text-[11px] text-blue-700">📌 MAKSUDNYA APA?</p><p class="mt-1">${exp.maksud}</p></div><div class="bg-green-50 border-l-4 border-green-500 p-3 rounded"><p class="font-bold text-[11px] text-green-700">🎯 BUAT APA?</p><p class="mt-1">${exp.tujuan}</p></div><div class="bg-amber-50 border-l-4 border-amber-500 p-3 rounded"><p class="font-bold text-[11px] text-amber-700">🛠️ CARA MEMBUATNYA:</p><p class="mt-1 whitespace-pre-line">${exp.cara}</p></div>`;
  currentExplainText = `TUGAS: ${realText}\nMAKSUD: ${exp.maksud}\nTUJUAN: ${exp.tujuan}\nCARA: ${exp.cara}`;
  document.getElementById('explainModal').classList.remove('hidden');
}
function closeExplain(){ document.getElementById('explainModal').classList.add('hidden'); }
function copyExplain(){ navigator.clipboard.writeText(currentExplainText).then(()=>{ alert('Dicopy!'); }); }
function getDeleted(day){return JSON.parse(localStorage.getItem(`deleted_${day}`)||'[]');}
function getAdded(day){return JSON.parse(localStorage.getItem(`added_${day}`)||'[]');}
function getText(day,idx,def){return localStorage.getItem(`custom_text_${day}_${idx}`)||def;}
function getStatus(day,idx,isAdd){return localStorage.getItem(isAdd?`status_${day}_add_${idx}`:`status_${day}_${idx}`)||'';}
function isChecked(day,idx,isAdd){const prefixes=['v28','v27','v26']; for(let p of prefixes){const key=isAdd?`${p}_${day}_add_${idx}`:`${p}_${day}_${idx}`; if(localStorage.getItem(key)==='1') return true;} return false;}
function getCheckTime(day,idx,isAdd){return localStorage.getItem(`check_time_${day}_${isAdd?'add_':''}${idx}`)||'';}
const baseDays=[
{d:1,t:"Laporan Diri Tingkat Desa",m:"DESA",tasks:["Melaporkan keberadaan kepada Kepala Desa","Melaporkan kepada Lurah","Serah terima penugasan kepada Pengurus","Perkenalkan diri sebagai Manajer","Catat kontak Kades","Melaporkan kepada Babinsa","Catat kontak babinsa","Catat kontak ketua pengurus"]},
{d:2,t:"Silaturahmi",m:"DESA",tasks:["Silaturahmi Ketua BPD","Silaturahmi Anggota BPD","Silaturahmi Tokoh Masyarakat","Silaturahmi Ketua RT","Silaturahmi Ketua RW","Sampaikan visi inklusif","Sampaikan visi kolaboratif","Sampaikan visi transparan","Catat aspirasi"]},
{d:3,t:"Inventarisasi Aset",m:"GERAI",tasks:["Periksa kantor koperasi","Catat ukuran kantor","Periksa mesin/peralatan","Catat kondisi mesin","Periksa persediaan barang","Catat stok barang","Foto aset untuk BAST"]},
{d:4,t:"Audit Administrasi",m:"RUMAH",tasks:["Periksa dokumen legalitas","Periksa buku rekening bank","Periksa arsip keuangan","Test login SIMKOPDES","Pastikan SIMKOPDES lancar"]},
{d:5,t:"Pemetaan Anggota",m:"RUMAH",tasks:["Kumpulkan data anggota aktif","Kumpulkan data anggota pasif","Data calon anggota potensial","Rekap jumlah anggota","Siapkan untuk input SIMKOPDES"]},
{d:6,t:"Pemetaan Ekonomi",m:"RUMAH",tasks:["Tinjau data Desil wilayah","Identifikasi kelompok sasaran","Petakan potensi ekonomi","Catat kelompok tani/nelayan"]},
{d:7,t:"BAST Minggu 1",m:"RUMAH",tasks:["Susun BAST Aset","Susun Pemetaan Awal","Kirim laporan Minggu 1 ke Kades"]},
{d:8,t:"SIMKOPDES Anggota",m:"RUMAH",tasks:["Input data keanggotaan","Update data keanggotaan","Input profil KDKMP","Verifikasi NIK"]},
{d:9,t:"SIMKOPDES Keuangan",m:"RUMAH",tasks:["Tata alur pembukuan","Sesuaikan dengan standar SIMKOPDES","Input saldo kas","Input saldo bank"]},
{d:10,t:"Integrasi Privy",m:"RUMAH",tasks:["Pastikan ttd dokumen terintegrasi","Pastikan kontrak terintegrasi Privy","Uji coba Privy"]},
{d:11,t:"SOP Kas",m:"RUMAH",tasks:["Susun SOP kas kecil","Susun SOP penerimaan","Susun SOP laporan harian"]},
{d:12,t:"SOP Pelayanan & Stok",m:"RUMAH",tasks:["SOP pendaftaran anggota baru","SOP simpanan","SOP prosedur pengajuan","SOP pengelolaan stok","SOP perdagangan/waserda"]},
{d:13,t:"Persiapan Rapat",m:"RUMAH",tasks:["Siapkan materi pemetaan","Siapkan draf SOP","Buat undangan Pengurus","Buat undangan Pengawas"]},
{d:14,t:"Rapat Konsolidasi",m:"DESA",tasks:["Presentasi pemetaan ke Pengurus","Presentasi SOP ke Pengawas","Sepakati Q1 Targets","Deliverable SIMKOPDES & SOP"]},
{d:15,t:"Quick Win Sembako",m:"RUMAH",tasks:["Tentukan Quick Win","Daftar kebutuhan pokok","Cek harga bersaing","Koordinasi 1 pintu Agrinas"]},
{d:16,t:"Quick Win Pertanian & PPOB",m:"RUMAH",tasks:["Data kebutuhan pupuk","Data kebutuhan pakan","Data kebutuhan bibit","Layanan listrik","Layanan air","Layanan BPJS"]},
{d:17,t:"Pencatatan Real-time",m:"GERAI",tasks:["Catat transaksi Quick Win real-time","Cek stok harian","Cek kas harian"]},
{d:18,t:"Sosialisasi Forum",m:"DESA",tasks:["Sosialisasi rembug warga","Sosialisasi pengajian","Sosialisasi RWT/RTL"]},
{d:19,t:"Edukasi Keanggotaan",m:"DESA",tasks:["Jelaskan hak anggota","Jelaskan kewajiban","Jelaskan keuntungan","Jelaskan SHU","Jelaskan akses usaha"]},
{d:20,t:"Posko Pendaftaran",m:"DESA",tasks:["Buka posko pendaftaran","Tentukan lokasi strategis","Bagi formulir","Catat calon anggota"]},
{d:21,t:"Deliverable Minggu 3",m:"GERAI",tasks:["Evaluasi layanan Quick Win","Hitung anggota baru","Laporan Minggu 3"]},
{d:22,t:"Reconcile",m:"RUMAH",tasks:["Cocokkan kas fisik","Cocokkan rekening bank","Cocokkan SIMKOPDES","Catat selisih"]},
{d:23,t:"Laporan Keuangan",m:"RUMAH",tasks:["Susun Laba/Rugi","Susun Neraca Kas","Susun Perkembangan Anggota"]},
{d:24,t:"Analisis",m:"RUMAH",tasks:["Analisis omzet","Analisis margin","Analisis animo warga"]},
{d:25,t:"Persiapan Eksternal",m:"RUMAH",tasks:["Siapkan Laporan Kinerja Manajer","Siapkan data Dinkop","Siapkan data Kementerian"]},
{d:26,t:"Pelaporan Eksternal",m:"RUMAH",tasks:["Kirim ke Dinkop","Kirim ke Kementerian","Hubungi Pendamping","Hubungi Pembina"]},
{d:27,t:"Diskusi",m:"RUMAH",tasks:["Diskusi dengan Pendamping","Catat masukan","Catat arahan"]},
{d:28,t:"Persiapan Evaluasi",m:"RUMAH",tasks:["Siapkan materi evaluasi","Daftar capaian","Daftar kendala"]},
{d:29,t:"Rapat Evaluasi",m:"DESA",tasks:["Rapat dengan Pengurus","Bahasa capaian 30 hari","Catat masukan"]},
{d:30,t:"Rencana Bulan 2",m:"RUMAH",tasks:["Susun Rencana Bulan 2","Fokus unit usaha baru","Rencana kemitraan","Rencana permodalan","Finalisasi Laporan Resmi","Finalisasi Master Plan","Export untuk Kades","Export untuk Korwil","Export untuk Dinas"]},
];
function render(){
 const startObj=getStartDateObj(); const hariIni=getHariIni();
 document.getElementById('tgl').innerText=`Start: ${startObj.toLocaleDateString('id-ID')} | Hari ke-${hariIni}`;
 const all=[...baseDays]; let total=0,done=0; all.forEach(d=>{const del=getDeleted(d.d); const add=getAdded(d.d); total+=d.tasks.length-del.length+add.length; d.tasks.forEach((_,i)=>{if(!del.includes(i)&&isChecked(d.d,i,false)) done++;}); add.forEach((_,i)=>{if(isChecked(d.d,i,true)) done++;});});
 const persen=total?Math.round(done/total*100):0; document.getElementById('bar').style.width=persen+'%'; document.getElementById('txt').innerText=persen+'% ('+done+'/'+total+')';
 const nav=document.getElementById('navHari'); nav.innerHTML='';
 for(let i=1;i<=30;i++){ const isToday=i===hariIni; const btn=document.createElement('button'); btn.textContent=i; btn.className=`px-2.5 py-1 rounded-full text-[10px] font-bold border ${isToday?'bg-[#BE1E2D] text-white border-[#BE1E2D]':'bg-white text-slate-700 border-slate-300'}`; btn.onclick=()=>scrollToHari(i); nav.appendChild(btn); }
 function buildTaskHtml(day, modeTunggakan){
   const deleted=getDeleted(day.d); const added=getAdded(day.d); let html='';
   day.tasks.forEach((orig,i)=>{
     if(deleted.includes(i)) return;
     const text=getText(day.d,i,orig);
     const chk=isChecked(day.d,i,false);
     if(modeTunggakan && (chk || day.d >= hariIni)) return;
     html+=`<div class="flex items-center gap-1 py-2.5 px-2 border-b hover:bg-slate-50"><input type="checkbox" data-day="${day.d}" data-idx="${i}" data-add="0" ${chk?'checked':''} class="w-5 h-5 accent-[#BE1E2D] shrink-0"><span class="flex-1 text-[11px] ${chk?'line-through text-slate-400':''}">${text}</span><button onclick="showExplain(${day.d},${i},false)" class="bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded-full text-[9px] font-bold shrink-0">❓</button></div>`;
   });
   added.forEach((t,i)=>{
     let clean=t.trim(); const chk=isChecked(day.d,i,true); if(modeTunggakan && (chk || day.d >= hariIni)) return;
     html+=`<div class="flex items-center gap-1 py-2 px-2 border-b bg-red-50/30"><input type="checkbox" data-day="${day.d}" data-idx="${i}" data-add="1" ${chk?'checked':''} class="w-5 h-5 accent-[#BE1E2D]"><span class="flex-1 text-[11px]">${clean}</span><button onclick="showExplain(${day.d},${i},true)" class="bg-blue-50 text-blue-600 border px-2 py-1 rounded-full text-[9px] font-bold">❓</button></div>`;
   });
   return html;
 }
 const container1=document.getElementById('container1'); container1.innerHTML='';
 baseDays.sort((a,b)=>a.d-b.d).forEach(day=>{
   const html=buildTaskHtml(day,false);
   const isToday=day.d===hariIni; const color=day.m==='RUMAH'?'bg-blue-100 text-blue-700':day.m==='DESA'?'bg-orange-100 text-orange-700':'bg-green-100 text-green-700';
   const div=document.createElement('div'); div.id='hari-'+day.d; div.className=`bg-white p-3 rounded-xl border shadow-sm ${isToday?'ring-2 ring-[#BE1E2D]':''}`;
   div.innerHTML=`<div class="flex justify-between items-center mb-2"><p class="font-bold text-[12px]">${isToday?'👉 ':''}HARI ${day.d}: ${day.t}</p><span class="text-[9px] px-2 py-0.5 rounded-full ${color}">${day.m}</span></div><div class="border rounded-lg overflow-hidden">${html}</div><div class="flex gap-2 mt-2"><input id="input_${day.d}" placeholder="Tambah kotak..." class="flex-1 border rounded-lg p-2 text-[11px]"><button onclick="addTaskBox(${day.d})" class="bg-[#BE1E2D] text-white px-4 py-2 rounded-lg text-[11px]">+ Kotak</button></div>`;
   container1.appendChild(div);
 });
 const container2=document.getElementById('container2'); container2.innerHTML='';
 let tunggakanList=[];
 baseDays.forEach(d=>{ const del=getDeleted(d.d); d.tasks.forEach((_,i)=>{ if(del.includes(i)) return; if(!isChecked(d.d,i,false) && d.d < hariIni){ tunggakanList.push({day:d.d}); } }); });
 const badge=document.getElementById('badgeTunggakan');
 if(tunggakanList.length>0){ badge.textContent=tunggakanList.length; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); }
 if(tunggakanList.length===0){ container2.innerHTML=`<div class="bg-white border p-6 rounded-xl text-center"><p class="text-[14px] font-bold text-green-600">✅ Tidak ada tunggakan!</p></div>`; }
 else { baseDays.filter(d=>d.d < hariIni).forEach(d=>{ const html=buildTaskHtml(d,true); if(html){ const div=document.createElement('div'); div.className=`bg-white p-3 rounded-xl border-l-4 border-[#BE1E2D] shadow-sm`; div.innerHTML=`<div class="flex justify-between items-center mb-2"><p class="font-bold text-[12px] text-[#BE1E2D]">HARI ${d.d}: ${d.t}</p></div><div class="border rounded-lg overflow-hidden">${html}</div>`; container2.appendChild(div); } }); }
 document.querySelectorAll('#container1 input[type=checkbox], #container2 input[type=checkbox]').forEach(cb=>{
   cb.addEventListener('change',e=>{
     const day=e.target.dataset.day; const idx=e.target.dataset.idx; const isAdd=e.target.dataset.add==='1';
     const key=`v28_${day}${isAdd?'_add':''}_${idx}`;
     localStorage.setItem(key,e.target.checked?'1':'0');
     render();
   });
 });
}
function toggleNote(day){localStorage.setItem(`noteActive_${day}`,document.getElementById(`checkNote_${day}`).checked?'1':'0'); render();}
function saveNote(day){localStorage.setItem(`note_${day}`,document.getElementById(`note_${day}`).value);}
function editTask(d,i,a){const def=baseDays.find(x=>x.d===d)?.tasks[i]||''; const cur=getText(d,i,def); const b=prompt('Edit:',cur); if(b===null) return; if(b.trim()===def||!b.trim()) localStorage.removeItem(`custom_text_${d}_${i}`); else localStorage.setItem(`custom_text_${d}_${i}`,b.trim()); render();}
function addTaskBox(d){let v=document.getElementById(`input_${d}`).value.trim(); if(!v) return; const ad=getAdded(d); ad.push(v); localStorage.setItem(`added_${d}`,JSON.stringify(ad)); document.getElementById(`input_${d}`).value=''; render();}
function setStatus(d,i,v,a){const k=a?`status_${d}_add_${i}`:`status_${d}_${i}`; const cur=localStorage.getItem(k); if(cur===v) localStorage.removeItem(k); else localStorage.setItem(k,v); render();}
function exportPDF(onlyTunggakan=false){
 const doc=new jsPDF('l','mm','a4'); const startObj=getStartDateObj(); const hariIni=getHariIni();
 doc.setFillColor(190,30,45); doc.rect(0,0,297,32,'F'); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(onlyTunggakan?`TUNGGAKAN V35`:`KERJA 30 HARI V35 + PENJELASAN`,148.5,14,{align:'center'});
 const rows=[];
 [...baseDays].sort((a,b)=>a.d-b.d).forEach(day=>{
   const del=getDeleted(day.d); const isOverdue=day.d < hariIni;
   day.tasks.forEach((orig,i)=>{
     if(del.includes(i)) return; const chk=isChecked(day.d,i,false); if(onlyTunggakan && (chk || !isOverdue)) return;
     let text=getText(day.d,i,orig); const exp=EXPLANATIONS[text]; let penjelasan = exp? ` | ${exp.maksud}` : '';
     rows.push([`Hari ${day.d}`,day.t,text+penjelasan,chk?'SELESAI':'BELUM']);
   });
 });
 doc.autoTable({startY:36, head:[['HARI','JUDUL','KEGIATAN + PENJELASAN','STATUS']], body:rows, theme:'grid', styles:{fontSize:6}, headStyles:{fillColor:[190,30,45]}});
 doc.save(onlyTunggakan ? `TUNGGAKAN-V35.pdf` : `LENGKAP-V35-PENJELASAN.pdf`);
}
function exportWord(onlyTunggakan=false){
  let htmlContent = `<html><head><meta charset="UTF-8"><style>table{width:100%;border-collapse:collapse;} th{background:#BE1E2D;color:white;} td,th{border:1px solid #ccc;padding:5px;font-size:11px;}</style></head><body><h1>V35 PENJELASAN</h1><table><tr><th>HARI</th><th>KEGIATAN</th><th>PENJELASAN</th><th>STATUS</th></tr>`;
  baseDays.forEach(day=>{
    day.tasks.forEach((orig,i)=>{
      const del=getDeleted(day.d); if(del.includes(i)) return; const chk=isChecked(day.d,i,false); if(onlyTunggakan && chk) return;
      const text=getText(day.d,i,orig); const exp = EXPLANATIONS[text] || {maksud:"-", tujuan:"-", cara:"-"};
      htmlContent+=`<tr><td>Hari ${day.d}</td><td>${text}</td><td><b>Maksud:</b> ${exp.maksud}<br><b>Tujuan:</b> ${exp.tujuan}<br><b>Cara:</b> ${exp.cara}</td><td>${chk?'SELESAI':'BELUM'}</td></tr>`;
    });
  });
  htmlContent+=`</table></body></html>`;
  const blob = new Blob([htmlContent], {type:'application/msword'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download = `V35-PENJELASAN.doc`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
render();
</script>
