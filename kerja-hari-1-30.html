function autoPush(){
  clearTimeout(autoPushTimer);
  autoPushTimer = setTimeout(()=>{
    isLocalChange = true;
    const payload = { updatedAt: new Date().toISOString(), desa: "Kasih 53354 V51 FULL AUTO" };
    for(let i=0;i<localStorage.length;i++){
      let k=localStorage.key(i);
      if(k.startsWith('chk_')||k.startsWith('ada_')||k.startsWith('catatan_')||k.startsWith('foto_')||k.startsWith('custom_')||k.startsWith('edited_')||k.startsWith('nama')){

      }
    }
    REF.set(payload).then(()=>{
      document.getElementById('status').textContent="✅ Auto Live "+new Date().toLocaleTimeString('id-ID');
      setTimeout(()=>{isLocalChange=false;},1500);
    });
  },500); // debounce 0.5 detik biar gak spam
}

REF.on('value', snap=>{
  if(isLocalChange) return;
  const data=snap.val();
  if(!data || !data.updatedAt) return;
  // cek apakah data lebih baru dari local terakhir
  let count=0;
  Object.keys(data).forEach(k=>{
    if(k.startsWith('chk_')||k.startsWith('ada_')||k.startsWith('catatan_')||k.startsWith('foto_')||k.startsWith('custom_')||k.startsWith('edited_')||k.startsWith('nama')){
      if(localStorage.getItem(k)!==data[k]){
        localStorage.setItem(k, data[k]);
        count++;
      }
    }
  });
  if(count>0){
    document.getElementById('status').textContent="🔴 LIVE UPDATE "+count+" dari HP lain - "+new Date().toLocaleTimeString('id-ID');
    document.getElementById('liveStatus').textContent="🔴 UPDATE LIVE";

function getDeleted(){return JSON.parse(localStorage.getItem('deleted_tasks')||'[]');}
function getEdited(){return JSON.parse(localStorage.getItem('edited_tasks')||'{}');}
function getAda(d,i){return localStorage.getItem('ada_'+d+'_'+i)||'';}
function getCatatan(d){return localStorage.getItem('catatan_'+d)||'';}
function isCatatanActive(d){return localStorage.getItem('catatan_active_'+d)!=='false';}
function getCustom(d){return JSON.parse(localStorage.getItem('custom_'+d)||'[]');}
function isChecked(d,i){return localStorage.getItem('chk_'+d+'_'+i)==='1';}
function getFoto(d,i){return JSON.parse(localStorage.getItem('foto_'+d+'_'+i)||'null');}
function getStart(){const s=localStorage.getItem('kdkmp_startDate'); if(s){const d=new Date(s); d.setHours(0,0,0,0); return d;} const def=new Date('2026-10-01T00:00:00'); def.setHours(0,0,0,0); localStorage.setItem('kdkmp_startDate',def.toISOString()); return def;}
function setStartDate(val){if(!val) return; const d=new Date(val); d.setHours(0,0,0,0); localStorage.setItem('kdkmp_startDate',d.toISOString()); autoPush(); render();}
function getHariIni(){const s=getStart(); const now=new Date(); now.setHours(0,0,0,0); return Math.max(1,Math.min(31,Math.floor((now-s)/86400000)+1));}
function getTanggalForHari(h){const s=getStart(); const d=new Date(s); d.setDate(s.getDate()+(h-1)); return d;}
function formatTanggalIndo(date){return date.toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long', year:'numeric'});}

function scrollToHari(d){switchTab(1); setTimeout(()=>{const el=document.getElementById('hari-'+d); if(el){const y=el.getBoundingClientRect().top+window.pageYOffset-160; window.scrollTo({top:y,behavior:'smooth'});}},100);}
function saveNames(){['Kades','Ketua'].forEach(k=>{const el=document.getElementById('nama'+k); if(el) localStorage.setItem('nama'+k,el.value);}); autoPush();}
function saveImg(input,key){const f=input.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{localStorage.setItem(key,e.target.result); loadImgs(); autoPush();}; r.readAsDataURL(f);}
function loadImgs(){const map={'ttdKades':'prevKades','ttdKetua':'prevKetua'}; Object.entries(map).forEach(([k,el])=>{const d=localStorage.getItem(k); const e=document.getElementById(el); if(d&&e){e.src=d; e.classList.remove('hidden');}});}
function editTask(d,i){const cur=getEdited()[d+'_'+i]||baseDays.find(x=>x.d===d).tasks[i]; const baru=prompt('Edit:',cur); if(!baru) return; const ed=getEdited(); ed[d+'_'+i]=baru; localStorage.setItem('edited_tasks',JSON.stringify(ed)); autoPush(); render();}
function deleteTask(d,i){if(!confirm('Hapus?')) return; const del=getDeleted(); del.push(d+'_'+i); localStorage.setItem('deleted_tasks',JSON.stringify(del)); autoPush(); render();}
function setAda(d,i,val){const cur=getAda(d,i); if(cur===val) localStorage.removeItem('ada_'+d+'_'+i); else localStorage.setItem('ada_'+d+'_'+i,val); autoPush(); render();}

function deleteCustom(d,idx){const cur=getCustom(d); cur.splice(idx,1); localStorage.setItem('custom_'+d,JSON.stringify(cur)); autoPush(); render();}

function deleteFoto(d,i){if(!confirm('Hapus foto?')) return; localStorage.removeItem('foto_'+d+'_'+i); autoPush(); render();}

function render(){
  const start=getStart(); const hariIni=getHariIni();
  const inputEl=document.getElementById('startDateInput'); if(inputEl){const iso=start.toISOString().split('T')[0]; if(inputEl.value!==iso) inputEl.value=iso;}
  document.getElementById('tgl').textContent="Mulai: "+formatTanggalIndo(start)+" | Hari ke-"+hariIni+" | AUTO LIVE";
  let total=0,done=0,fotoTotal=0; baseDays.forEach(d=>{const del=getDeleted(); d.tasks.forEach((_,i)=>{if(!del.includes(d.d+'_'+i)){total++; if(isChecked(d.d,i)) done++; if(getFoto(d.d,i)) fotoTotal++;}});});
  const nav=document.getElementById('navHari'); nav.innerHTML="";
  for(let i=1;i<=31;i++){let allDone=true; let hasFoto=false; baseDays.find(x=>x.d===i)?.tasks.forEach((_,idx)=>{if(!getDeleted().includes(i+'_'+idx)&&!isChecked(i,idx)) allDone=false; if(getFoto(i,idx)) hasFoto=true;}); const isToday=i===hariIni; const btn=document.createElement('button'); btn.innerHTML=i+(hasFoto?"<span class='text-[6px]'>📷</span>":""); btn.className="font-bold border shadow-sm flex flex-col items-center justify-center shrink-0 "+(isToday?"bg-[#BE1E2D] text-white ring-2 ring-yellow-300":allDone?"bg-green-500 text-white":"bg-white text-slate-700"); btn.onclick=()=>scrollToHari(i); nav.appendChild(btn);}
  const c1=document.getElementById('container1'); c1.innerHTML=""; const editedMap=getEdited(); const deletedList=getDeleted();
  baseDays.forEach(day=>{
    const tgl=getTanggalForHari(day.d);

    let html="<div class='flex justify-between mb-2'><div><p class='font-bold text-[12px]'>"+(day.d===hariIni?"👉 ":"")+"HARI "+day.d+": "+day.t+"</p><p class='text-[8px] text-slate-500'>📅 "+formatTanggalIndo(tgl)+" - Desa Kasih 53354 - V51 FULL - ADA/TIDAK/BELUM + FOTO - AUTO LIVE</p></div><span class='text-[8px] px-2 py-0.5 rounded bg-slate-100 h-fit'>"+day.m+"</span></div><div class='border rounded-lg overflow-hidden'>";
    day.tasks.forEach((orig,i)=>{
      if(deletedList.includes(day.d+'_'+i)) return;
      const taskName=editedMap[day.d+'_'+i]||orig; const chk=isChecked(day.d,i); const ada=getAda(day.d,i); const foto=getFoto(day.d,i);
      html+="<div class='task-row "+(chk?"bg-green-50":"")+" "+(foto?"border-l-4 border-blue-400":"")+"'><input type='checkbox' "+(chk?"checked":"")+" onchange='(function(el){localStorage.setItem(\"chk_"+day.d+"_"+i+"\",el.checked?\"1\":\"0\"); autoPush(); render();})(this)' class='w-5 h-5 accent-[#BE1E2D] shrink-0'><span class='flex-1 text-[11px] min-w-0 "+(chk?"line-through text-slate-400":"")+"'>"+taskName+(foto?"<br><span class='text-[8px] bg-blue-100 text-blue-700 px-1 rounded'>📷 "+(foto.caption?foto.caption.substring(0,30):"Foto")+"</span>":"")+"</span><div class='task-right shrink-0'>";
      if(foto){ html+="<img src='"+foto.data+"' class='foto-thumb'><button onclick='openFotoModal("+day.d+","+i+")' class='px-1 py-1 rounded text-[7px] font-bold bg-blue-600 text-white'>✏️</button><button onclick='deleteFoto("+day.d+","+i+")' class='px-1 py-1 rounded text-[7px] bg-red-100 border'>🗑️</button>"; } else { html+="<button onclick='openFotoModal("+day.d+","+i+")' class='px-1 py-1 rounded text-[7px] font-bold bg-white border border-blue-300 text-blue-700'>📷 Foto</button>"; }
      html+="<button onclick=\"setAda("+day.d+","+i+",'ADA')\" class='px-1.5 py-1 rounded text-[7px] font-bold border "+(ada==='ADA'?"bg-green-600 text-white":"bg-white text-green-700")+"'>ADA</button>";
      html+="<button onclick=\"setAda("+day.d+","+i+",'TIDAK')\" class='px-1.5 py-1 rounded text-[7px] font-bold border "+(ada==='TIDAK'?"bg-red-600 text-white":"bg-white text-red-700")+"'>TIDAK</button>";
      html+="<button onclick=\"setAda("+day.d+","+i+",'BELUM')\" class='px-1.5 py-1 rounded text-[7px] font-bold border "+(ada==='BELUM'?"bg-amber-500 text-white":"bg-white text-amber-700")+"'>BELUM</button>";
      html+="<button onclick='editTask("+day.d+","+i+")' class='px-1 py-1 rounded text-[7px] font-bold bg-yellow-50 border'>✏️</button>";
      html+="<button onclick='deleteTask("+day.d+","+i+")' class='px-1 py-1 rounded text-[7px] font-bold bg-red-50 border'>🗑️</button>";
      html+="</div></div>";
    });
    html+="</div><div class='mt-2 flex gap-1'><input id='addInput-"+day.d+"' placeholder='Tambah tugas...' class='flex-1 border rounded-lg px-2 py-1.5 text-[10px]'><button onclick='addCustomTask("+day.d+")' class='bg-[#BE1E2D] text-white px-3 py-1.5 rounded-lg text-[10px] font-bold'>+ Tugas</button></div>";
    const catActive=isCatatanActive(day.d);
    html+="<div class='mt-2 border rounded-lg overflow-hidden "+(catActive?"border-blue-300":"")+"'><div class='flex justify-between items-center px-2 py-1 bg-slate-50'><p class='text-[9px] font-bold'>📝 Catatan Hari "+day.d+"</p><label class='flex items-center gap-1 text-[9px]'><input type='checkbox' "+(catActive?"checked":"")+" onchange='toggleCatatan("+day.d+")' class='w-3 h-3'> <span class='"+(catActive?"text-blue-600 font-bold":"text-slate-500")+"'>"+(catActive?"ON AUTO LIVE":"OFF")+"</span></label></div>"+(catActive?"<textarea id='catatan-"+day.d+"' oninput='saveCatatan("+day.d+")' placeholder='Catatan auto live...' class='w-full p-2 text-[10px] h-16'>"+getCatatan(day.d)+"</textarea>":"<p class='text-[8px] text-slate-400 p-2 italic'>Catatan nonaktif</p>")+"</div>";
    // custom tasks
    const custom=getCustom(day.d);
    if(custom.length>0){
      html+="<div class='mt-2 border-2 border-dashed border-[#BE1E2D]/20 rounded-lg p-2'><p class='text-[8px] font-bold text-[#BE1E2D]'>Tugas Tambahan - Auto Live:</p>";
      custom.forEach((ct,idx)=>{
        html+="<div class='flex gap-2 py-1'><span class='flex-1 text-[11px]'>"+ct+"</span><button onclick='deleteCustom("+day.d+","+idx+")' class='text-[8px] bg-red-100 px-1 rounded'>Hapus</button></div>";
      });
      html+="</div>";
    }
    div.innerHTML=html; c1.appendChild(div);
  });
  const c2=document.getElementById('container2'); c2.innerHTML="";
  let tung=0; baseDays.forEach(d=>{const del=getDeleted(); d.tasks.forEach((_,i)=>{if(!del.includes(d.d+'_'+i) && d.d<getHariIni() && !isChecked(d.d,i)) tung++;});});
  document.getElementById('badgeTunggakan').textContent=tung; document.getElementById('badgeTunggakan').classList.toggle('hidden',tung===0);
  if(tung===0){c2.innerHTML="<div class='bg-white border-2 border-green-300 rounded-xl p-6 text-center'><p class='text-[30px]'>✅</p><p class='font-bold text-[12px] text-green-700 mt-2'>Tidak ada tunggakan! Semua auto live</p></div>";}
  else {baseDays.filter(d=>d.d<getHariIni()).forEach(day=>{let html=""; let has=false; day.tasks.forEach((_,i)=>{if(getDeleted().includes(day.d+'_'+i)) return; if(!isChecked(day.d,i)){has=true; const name=getEdited()[day.d+'_'+i]||day.tasks[i]; const ada=getAda(day.d,i); html+="<div class='flex gap-2 py-2 px-2 border-b bg-red-50/50'><span class='flex-1 text-[11px]'>"+name+" <span class='text-[7px] bg-white border px-1 rounded'>"+(ada||"BELUM")+"</span></span><button onclick='scrollToHari("+day.d+")' class='bg-[#BE1E2D] text-white px-2 py-1 rounded text-[8px]'>Ke Hari "+day.d+"</button></div>";}}); if(has){const tgl=getTanggalForHari(day.d); const div=document.createElement('div'); div.className="bg-white p-3 rounded-xl border-l-4 border-[#BE1E2D] shadow-sm"; div.innerHTML="<p class='font-bold text-[11px] text-[#BE1E2D]'>HARI "+day.d+": "+day.t+" - "+tgl.toLocaleDateString('id-ID')+"</p><div class='border rounded-lg mt-2'>"+html+"</div>"; c2.appendChild(div);}});}
}

loadImgs();
if(!localStorage.getItem('kdkmp_startDate')){localStorage.setItem('kdkmp_startDate',new Date('2026-10-01T00:00:00').toISOString());}
render();
document.getElementById('status').textContent="✅ AUTO REALTIME CONNECTED - asia-southeast1";
document.getElementById('liveStatus').textContent="AUTO LIVE";
</script>
