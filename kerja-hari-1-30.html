<style>

<body class="bg-[#fef2f2]">
<div class="bg-[#BE1E2D] text-white sticky top-0 z-50 shadow">
<div class="max-w-6xl mx-auto p-2">
<div class="flex justify-between items-center">
<div><h1 class="font-bold text-[11px]">🇮🇩 KDKMP V42 - MENU KANAN + CATATAN ON/OFF</h1><p id="tgl" class="text-[8px] text-yellow-200"></p></div>
<div class="flex items-center gap-2">
<div class="w-16 h-2 bg-white/30 rounded-full"><div id="bar" class="h-2 bg-white rounded-full" style="width:0%"></div></div>

<button id="tab2" onclick="switchTab(2)" class="px-3 py-1.5 rounded text-[9px] font-bold bg-black/20 text-white">TUNG<span id="badgeTunggakan" class="hidden bg-yellow-300 text-black px-1 rounded-full text-[7px]">0</span></button>
<button id="tab3" onclick="switchTab(3)" class="px-3 py-1.5 rounded text-[9px] font-bold bg-black/20 text-white">TTD</button>
</div>

</div>

<p class="text-[9px] font-bold text-[#BE1E2D]">📍 NAV 1-31 Klik loncat (HP besar, Laptop 1 baris):</p>

</div>
</div>

<div id="explainModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-3">
<div class="bg-white rounded-xl max-w-lg w-full"><div class="bg-[#BE1E2D] text-white p-3 flex justify-between"><div><p id="modalTitle" class="font-bold text-[12px]"></p><p id="modalSub" class="text-[9px]"></p></div><button onclick="closeExplain()" class="bg-white/20 w-6 h-6 rounded-full">X</button></div><div id="modalContent" class="p-3 space-y-2 text-[11px]"></div><div class="p-2 border-t flex gap-2"><button onclick="closeExplain()" class="flex-1 bg-slate-100 py-2 rounded">Tutup</button><button onclick="copyExplain()" class="flex-1 bg-[#BE1E2D] text-white py-2 rounded">Copy</button></div></div>
</div>

<div id="content1"><div id="container1" class="grid gap-3"></div></div>
<div id="content2" class="hidden"><div id="container2" class="grid gap-3"></div></div>

<div class="bg-white border-2 border-[#BE1E2D] rounded-xl p-3">
<p class="font-bold text-[12px] text-[#BE1E2D]">✍️ TTD + CAP LENGKAP</p>
<div class="grid grid-cols-1 md:grid-cols-3 gap-2 mt-2">
<div class="border p-2 rounded bg-orange-50"><p class="text-[9px] font-bold">Kades</p><input id="namaKades" placeholder="Nama Kades" class="w-full border rounded p-1 text-[9px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[7px] w-full mt-1" onchange="saveImg(this,'ttdKades')"><img id="prevKades" class="hidden w-full h-10 object-contain border mt-1"><label class="text-[8px]"><input type="checkbox" id="needKades" checked onchange="saveNeed()"> Tampil</label><p class="text-[9px] font-bold mt-2">Cap Kades</p><input type="file" accept="image/*" class="text-[7px] w-full mt-1" onchange="saveImg(this,'capKades')"><img id="prevCapKades" class="hidden w-full h-10 object-contain border mt-1"></div>
<div class="border p-2 rounded bg-red-50"><p class="text-[9px] font-bold">Manajer</p><input id="namaManajer" placeholder="Nama Manajer" class="w-full border rounded p-1 text-[9px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[7px] w-full mt-1" onchange="saveImg(this,'ttdManajer')"><img id="prevManajer" class="hidden w-full h-10 object-contain border mt-1"><label class="text-[8px]"><input type="checkbox" id="needManajer" checked onchange="saveNeed()"> Tampil</label><p class="text-[9px] font-bold mt-2">Cap Koperasi</p><input type="file" accept="image/*" class="text-[7px] w-full mt-1" onchange="saveImg(this,'capKoperasi')"><img id="prevCap" class="hidden w-full h-10 object-contain border mt-1"></div>
<div class="border p-2 rounded bg-blue-50"><p class="text-[9px] font-bold">Ketua</p><input id="namaKetua" placeholder="Nama Ketua" class="w-full border rounded p-1 text-[9px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[7px] w-full mt-1" onchange="saveImg(this,'ttdKetua')"><img id="prevKetua" class="hidden w-full h-10 object-contain border mt-1"><label class="text-[8px]"><input type="checkbox" id="needKetua" checked onchange="saveNeed()"> Tampil</label></div>
</div>
</div>
</div>
</div>

<script>
let currentExplainText="";
const EXPLANATIONS={
"Melaporkan keberadaan kepada Kepala Desa":{maksud:"Lapor resmi mulai tugas",tujuan:"Agar Kades dukung",cara:"Bawa SK, datang ke balai, foto buku tamu"},
"Test login SIMKOPDES":{maksud:"Coba login",tujuan:"Pastikan akun aktif",cara:"Login NIK, error hub pendamping"}
};
const baseDays=[
{d:1,t:"Laporan Diri Tingkat Desa",m:"DESA",tasks:["Melaporkan keberadaan kepada Kepala Desa","Melaporkan kepada Lurah","Serah terima penugasan kepada Pengurus","Perkenalkan diri sebagai Manajer","Catat kontak Kades","Melaporkan kepada Babinsa","Catat kontak babinsa","Catat kontak ketua pengurus"]},
{d:2,t:"Silaturahmi",m:"DESA",tasks:["Silaturahmi Ketua BPD","Silaturahmi Anggota BPD","Silaturahmi Tokoh Masyarakat","Silaturahmi Ketua RT","Silaturahmi Ketua RW","Sampaikan visi inklusif","Sampaikan visi kolaboratif","Sampaikan visi transparan","Catat aspirasi"]},
{d:3,t:"Inventarisasi Aset",m:"GERAI",tasks:["Periksa kantor koperasi","Catat ukuran kantor","Periksa mesin/peralatan","Catat kondisi mesin","Periksa persediaan barang","Catat stok barang","Foto aset untuk BAST"]},
{d:4,t:"Audit Administrasi",m:"RUMAH",tasks:["Periksa dokumen legalitas","Periksa buku rekening bank","Periksa arsip keuangan","Test login SIMKOPDES","Pastikan SIMKOPDES lancar"]},
{d:5,t:"Pemetaan Anggota",m:"RUMAH",tasks:["Kumpulkan data anggota aktif","Kumpulkan data anggota pasif","Data calon anggota potensial","Rekap jumlah anggota","Siapkan untuk input SIMKOPDES"]},
{d:6,t:"Pemetaan Ekonomi",m:"RUMAH",tasks:["Tinjau data Desil wilayah","Identifikasi kelompok sasaran","Petakan potensi ekonomi","Catat kelompok tani/nelayan"]},
{d:7,t:"BAST Minggu 1",m:"RUMAH",tasks:["Susun BAST Aset","Susun Pemetaan Awal","Kirim laporan Minggu 1 ke Kades"]},
{d:8,t:"SIMKOPDES Anggota",m:"RUMAH",tasks:["Input data keanggotaan","Update data keanggotaan","Input profil KDKMP","Verifikasi NIK"]},
{d:9,t:"SIMKOPDES Keuangan",m:"RUMAH",tasks:["Tata alur pembukuan","Sesuaikan dengan standar SIMKOPDES","Input saldo kas","Input saldo bank"]},
{d:10,t:"Integrasi Privy",m:"RUMAH",tasks:["Pastikan ttd dokumen terintegrasi","Pastikan kontrak terintegrasi Privy","Uji coba Privy"]},
{d:11,t:"SOP Kas",m:"RUMAH",tasks:["Susun SOP kas kecil","Susun SOP penerimaan","Susun SOP laporan harian"]},
{d:12,t:"SOP Pelayanan & Stok",m:"RUMAH",tasks:["SOP pendaftaran anggota baru","SOP simpanan","SOP prosedur pengajuan","SOP pengelolaan stok","SOP perdagangan/waserda"]},
{d:13,t:"Persiapan Rapat",m:"RUMAH",tasks:["Siapkan materi pemetaan","Siapkan draf SOP","Buat undangan Pengurus","Buat undangan Pengawas"]},
{d:14,t:"Rapat Konsolidasi",m:"DESA",tasks:["Presentasi pemetaan ke Pengurus","Presentasi SOP ke Pengawas","Sepakati Q1 Targets","Deliverable SIMKOPDES & SOP"]},
{d:15,t:"Quick Win Sembako",m:"RUMAH",tasks:["Tentukan Quick Win","Daftar kebutuhan pokok","Cek harga bersaing","Koordinasi 1 pintu Agrinas"]},
{d:16,t:"Quick Win Pertanian & PPOB",m:"RUMAH",tasks:["Data kebutuhan pupuk","Data kebutuhan pakan","Data kebutuhan bibit","Layanan listrik","Layanan air","Layanan BPJS"]},
{d:17,t:"Pencatatan Real-time",m:"GERAI",tasks:["Catat transaksi Quick Win real-time","Cek stok harian","Cek kas harian"]},
{d:18,t:"Sosialisasi Forum",m:"DESA",tasks:["Sosialisasi rembug warga","Sosialisasi pengajian","Sosialisasi RWT/RTL"]},
{d:19,t:"Edukasi Keanggotaan",m:"DESA",tasks:["Jelaskan hak anggota","Jelaskan kewajiban","Jelaskan keuntungan","Jelaskan SHU","Jelaskan akses usaha"]},
{d:20,t:"Posko Pendaftaran",m:"DESA",tasks:["Buka posko pendaftaran","Tentukan lokasi strategis","Bagi formulir","Catat calon anggota"]},
{d:21,t:"Deliverable Minggu 3",m:"GERAI",tasks:["Evaluasi layanan Quick Win","Hitung anggota baru","Laporan Minggu 3"]},
{d:22,t:"Reconcile",m:"RUMAH",tasks:["Cocokkan kas fisik","Cocokkan rekening bank","Cocokkan SIMKOPDES","Catat selisih"]},
{d:23,t:"Laporan Keuangan",m:"RUMAH",tasks:["Susun Laba/Rugi","Susun Neraca Kas","Susun Perkembangan Anggota"]},
{d:24,t:"Analisis",m:"RUMAH",tasks:["Analisis omzet","Analisis margin","Analisis animo warga"]},
{d:25,t:"Persiapan Eksternal",m:"RUMAH",tasks:["Siapkan Laporan Kinerja Manajer","Siapkan data Dinkop","Siapkan data Kementerian"]},
{d:26,t:"Pelaporan Eksternal",m:"RUMAH",tasks:["Kirim ke Dinkop","Kirim ke Kementerian","Hubungi Pendamping","Hubungi Pembina"]},
{d:27,t:"Diskusi",m:"RUMAH",tasks:["Diskusi dengan Pendamping","Catat masukan","Catat arahan"]},
{d:28,t:"Persiapan Evaluasi",m:"RUMAH",tasks:["Siapkan materi evaluasi","Daftar capaian","Daftar kendala"]},
{d:29,t:"Rapat Evaluasi",m:"DESA",tasks:["Rapat dengan Pengurus","Bahasa capaian 30 hari","Catat masukan"]},
{d:30,t:"Rencana Bulan 2",m:"RUMAH",tasks:["Susun Rencana Bulan 2","Fokus unit usaha baru","Rencana kemitraan","Rencana permodalan","Finalisasi Laporan Resmi","Finalisasi Master Plan","Export untuk Kades","Export untuk Korwil","Export untuk Dinas"]},
{d:31,t:"Evaluasi Akhir Bulan",m:"DESA",tasks:["Evaluasi total 30 hari","Laporan akhir ke Kades","Rencana Bulan 2","Tutup buku bulan 1"]}
];
function getDeleted(){return JSON.parse(localStorage.getItem('deleted_tasks')||'[]');}
function getEdited(){return JSON.parse(localStorage.getItem('edited_tasks')||'{}');}
function getAda(d,i){return localStorage.getItem('ada_'+d+'_'+i)||'';}
function getCatatan(d){return localStorage.getItem('catatan_'+d)||'';}
function isCatatanActive(d){return localStorage.getItem('catatan_active_'+d)!=='false';}
function getCustom(d){return JSON.parse(localStorage.getItem('custom_'+d)||'[]');}
function isChecked(d,i){return localStorage.getItem('chk_'+d+'_'+i)==='1';}
function getStart(){const s=localStorage.getItem('kdkmp_startDate'); if(s) return new Date(s); const n=new Date(); n.setHours(0,0,0,0); return n;}
function getHariIni(){const s=getStart(); const now=new Date(); now.setHours(0,0,0,0); return Math.max(1,Math.floor((now-s)/86400000)+1);}
function switchTab(n){document.getElementById('content1').classList.toggle('hidden',n!==1); document.getElementById('content2').classList.toggle('hidden',n!==2); document.getElementById('content3').classList.toggle('hidden',n!==3); ['tab1','tab2','tab3'].forEach((id,i)=>{document.getElementById(id).className=(i+1===n?'bg-white text-[#BE1E2D] shadow':'bg-black/20 text-white')+' px-3 py-1.5 rounded text-[9px] font-bold';});}
function scrollToHari(d){switchTab(1); setTimeout(()=>{const el=document.getElementById('hari-'+d); if(el){const y=el.getBoundingClientRect().top+window.pageYOffset-150; window.scrollTo({top:y,behavior:'smooth'}); el.classList.add('ring-4','ring-yellow-400'); setTimeout(()=>el.classList.remove('ring-4','ring-yellow-400'),1500);}},100);}
function saveNeed(){['Manajer','Kades','Cap','CapKades','Ketua'].forEach(k=>{const el=document.getElementById('need'+k); if(el) localStorage.setItem('need'+k,el.checked);});}
function loadNeed(){['Manajer','Kades','Cap','CapKades','Ketua'].forEach(k=>{const v=localStorage.getItem('need'+k); const el=document.getElementById('need'+k); if(el){if(v!==null) el.checked=v==='true';}});}
function saveNames(){['Manajer','Kades','Ketua'].forEach(k=>{const el=document.getElementById('nama'+k); if(el) localStorage.setItem('nama'+k,el.value);});}
function loadNames(){['Manajer','Kades','Ketua'].forEach(k=>{const v=localStorage.getItem('nama'+k); const el=document.getElementById('nama'+k); if(v&&el) el.value=v;});}
function saveImg(input,key){const f=input.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{localStorage.setItem(key,e.target.result); loadImgs();}; r.readAsDataURL(f);}
function loadImgs(){const map={'ttdManajer':'prevManajer','ttdKades':'prevKades','capKoperasi':'prevCap','capKades':'prevCapKades','ttdKetua':'prevKetua'}; Object.entries(map).forEach(([k,el])=>{const d=localStorage.getItem(k); const e=document.getElementById(el); if(d&&e){e.src=d; e.classList.remove('hidden');}});}

// FUNGSI MENU KANAN
function editTask(d,i){
  const cur=getEdited()[d+'_'+i] || baseDays.find(x=>x.d===d).tasks[i];
  const baru=prompt('Edit tugas:',cur);
  if(baru===null||!baru.trim()) return;
  const ed=getEdited(); ed[d+'_'+i]=baru.trim(); localStorage.setItem('edited_tasks',JSON.stringify(ed)); render();
}
function deleteTask(d,i){
  if(!confirm('Hapus tugas ini?')) return;
  const del=getDeleted(); del.push(d+'_'+i); localStorage.setItem('deleted_tasks',JSON.stringify(del)); render();
}
function setAda(d,i,val){
  if(getAda(d,i)===val){localStorage.removeItem('ada_'+d+'_'+i);} else {localStorage.setItem('ada_'+d+'_'+i,val);}
  render();
}
function addCustomTask(d){
  const inp=document.getElementById('addInput-'+d); const v=inp.value.trim(); if(!v) return;
  const cur=getCustom(d); cur.push(v); localStorage.setItem('custom_'+d,JSON.stringify(cur)); inp.value=''; render();
}
function deleteCustom(d,idx){const cur=getCustom(d); cur.splice(idx,1); localStorage.setItem('custom_'+d,JSON.stringify(cur)); render();}
function toggleCatatan(d){
  const cur=isCatatanActive(d);
  localStorage.setItem('catatan_active_'+d, cur?'false':'true');
  render();
}
function saveCatatan(d){localStorage.setItem('catatan_'+d,document.getElementById('catatan-'+d).value);}
function showExplain(d,i){
  const task=getEdited()[d+'_'+i]||baseDays.find(x=>x.d===d).tasks[i];
  const exp=EXPLANATIONS[task]||{maksud:"Tugas Hari "+d,tujuan:"Target 30 hari",cara:"Kerjakan sesuai SOP"};
  document.getElementById('modalTitle').textContent=task;
  document.getElementById('modalSub').textContent="Hari "+d;
  document.getElementById('modalContent').innerHTML="<div class='bg-blue-50 border-l-4 border-blue-500 p-2 rounded'><b>MAKSUD:</b> "+exp.maksud+"</div><div class='bg-green-50 border-l-4 border-green-500 p-2 rounded'><b>TUJUAN:</b> "+exp.tujuan+"</div><div class='bg-amber-50 border-l-4 border-amber-500 p-2 rounded'><b>CARA:</b> "+exp.cara+"</div>";
  currentExplainText=task;
  document.getElementById('explainModal').classList.remove('hidden');
}
function closeExplain(){document.getElementById('explainModal').classList.add('hidden');}
function copyExplain(){navigator.clipboard.writeText(currentExplainText).then(()=>alert('Dicopy'));}

function render(){
  const start=getStart(); const hariIni=getHariIni();
  document.getElementById('tgl').textContent="Start: "+start.toLocaleDateString('id-ID')+" | Hari ke-"+hariIni;
  let total=0,done=0;
  baseDays.forEach(d=>{const del=getDeleted(); d.tasks.forEach((_,i)=>{if(!del.includes(d.d+'_'+i)){total++; if(isChecked(d.d,i)) done++;}}); getCustom(d.d).forEach((_,i)=>{total++; if(isChecked(d.d,'c_'+i)) done++;});});
  const persen=total?Math.round(done/total*100):0;
  document.getElementById('bar').style.width=persen+"%";
  document.getElementById('txt').textContent=persen+"%";
  const nav=document.getElementById('navHari'); nav.innerHTML="";
  for(let i=1;i<=31;i++){
    const del=getDeleted();
    let allDone=true;
    baseDays.find(x=>x.d===i)?.tasks.forEach((_,idx)=>{if(!del.includes(i+'_'+idx)&&!isChecked(i,idx)) allDone=false;});
    getCustom(i).forEach((_,idx)=>{if(!isChecked(i,'c_'+idx)) allDone=false;});
    const isToday=i===hariIni;
    const btn=document.createElement('button');
    btn.textContent=i;
    btn.className="font-bold border shadow-sm flex items-center justify-center shrink-0 "+(isToday?"bg-[#BE1E2D] text-white ring-2 ring-yellow-300":allDone?"bg-green-500 text-white":"bg-white text-slate-700");
    btn.onclick=()=>scrollToHari(i);
    nav.appendChild(btn);
  }

  const c1=document.getElementById('container1'); c1.innerHTML="";
  const editedMap=getEdited(); const deletedList=getDeleted();
  baseDays.forEach(day=>{
    const div=document.createElement('div'); div.id="hari-"+day.d;
    div.className="bg-white p-3 rounded-xl border shadow-sm "+(day.d===hariIni?"ring-2 ring-[#BE1E2D]":"");
    let html="<div class='flex justify-between mb-2'><p class='font-bold text-[12px]'>"+(day.d===hariIni?"👉 ":"")+"HARI "+day.d+": "+day.t+"</p><span class='text-[8px] px-2 py-0.5 rounded bg-slate-100'>"+day.m+"</span></div>";
    html+="<div class='border rounded-lg overflow-hidden'>";
    day.tasks.forEach((orig,i)=>{
      if(deletedList.includes(day.d+'_'+i)) return;
      const taskName=editedMap[day.d+'_'+i]||orig;
      const chk=isChecked(day.d,i);
      const ada=getAda(day.d,i);
      html+="<div class='task-row "+(chk?"bg-green-50":"")+"'>";
      html+="<input type='checkbox' data-day='"+day.d+"' data-idx='"+i+"' "+(chk?"checked":"")+" class='w-5 h-5 accent-[#BE1E2D] shrink-0'>";
      html+="<span class='flex-1 text-[11px] min-w-0 "+(chk?"line-through text-slate-400":"")+"'>"+taskName+"</span>";
      // MENU KANAN - SEBELAH KANAN CEKLIS
      html+="<div class='task-right shrink-0'>";
      html+="<button onclick=\"setAda("+day.d+","+i+",'ADA')\" class='px-1.5 py-1 rounded text-[8px] font-bold border "+(ada==='ADA'?"bg-green-600 text-white border-green-600":"bg-white text-green-700 border-green-300")+"'>ADA</button>";
      html+="<button onclick=\"setAda("+day.d+","+i+",'TIDAK')\" class='px-1.5 py-1 rounded text-[8px] font-bold border "+(ada==='TIDAK'?"bg-red-600 text-white border-red-600":"bg-white text-red-700 border-red-300")+"'>TIDAK</button>";
      html+="<button onclick=\"setAda("+day.d+","+i+",'BELUM')\" class='px-1.5 py-1 rounded text-[8px] font-bold border "+(ada==='BELUM'?"bg-amber-500 text-white border-amber-500":"bg-white text-amber-700 border-amber-300")+"'>BELUM</button>";
      html+="<button onclick='editTask("+day.d+","+i+")' class='px-1.5 py-1 rounded text-[8px] font-bold bg-yellow-50 text-yellow-800 border border-yellow-300'>✏️</button>";
      html+="<button onclick='deleteTask("+day.d+","+i+")' class='px-1.5 py-1 rounded text-[8px] font-bold bg-red-50 text-red-700 border border-red-300'>🗑️</button>";
      html+="<button onclick='showExplain("+day.d+","+i+")' class='px-1.5 py-1 rounded-full text-[8px] font-bold bg-blue-50 text-blue-700 border border-blue-300'>❓</button>";
      html+="</div></div>";
    });
    // Custom
    const customs=getCustom(day.d);
    customs.forEach((ct,ci)=>{
      const chk=isChecked(day.d,'c_'+ci);
      html+="<div class='task-row bg-purple-50'><input type='checkbox' data-day='"+day.d+"' data-idx='c_"+ci+"' "+(chk?"checked":"")+" class='w-5 h-5 accent-purple-600 shrink-0'><span class='flex-1 text-[11px] "+(chk?"line-through":"")+"'>"+ct+"</span><div class='task-right'><button onclick='deleteCustom("+day.d+","+ci+")' class='px-1.5 py-1 rounded text-[8px] bg-red-100 border'>🗑️</button></div></div>";
    });
    html+="</div>";
    // Tambah kotak
    html+="<div class='mt-2 flex gap-1'><input id='addInput-"+day.d+"' placeholder='Tambah kotak...' class='flex-1 border rounded-lg px-2 py-1.5 text-[10px]'><button onclick='addCustomTask("+day.d+")' class='bg-[#BE1E2D] text-white px-3 py-1.5 rounded-lg text-[10px] font-bold'>+ Kotak</button></div>";
    // Catatan ON/OFF
    const catActive=isCatatanActive(day.d);
    html+="<div class='mt-2 border rounded-lg overflow-hidden "+(catActive?"border-blue-300":"border-slate-200")+"'>";
    html+="<div class='flex justify-between items-center px-2 py-1.5 bg-slate-50'>";
    html+="<p class='text-[9px] font-bold'>📝 Catatan Hari "+day.d+"</p>";
    html+="<label class='flex items-center gap-1 text-[9px] cursor-pointer'><input type='checkbox' "+(catActive?"checked":"")+" onchange='toggleCatatan("+day.d+")' class='w-3 h-3'> <span class='"+(catActive?"text-blue-600 font-bold":"text-slate-500")+"'>"+(catActive?"ON":"OFF")+"</span></label>";
    html+="</div>";
    if(catActive){
      html+="<textarea id='catatan-"+day.d+"' oninput='saveCatatan("+day.d+")' placeholder='Tulis catatan hari ini...' class='w-full p-2 text-[10px] h-16 focus:outline-none'>"+getCatatan(day.d)+"</textarea>";
    } else {
      html+="<p class='text-[8px] text-slate-400 p-2 italic'>Catatan nonaktif - klik ON untuk menulis</p>";
    }
    html+="</div>";
    div.innerHTML=html;
    c1.appendChild(div);
  });

  const c2=document.getElementById('container2'); c2.innerHTML="";
  let tung=0; baseDays.forEach(d=>{d.tasks.forEach((_,i)=>{if(!getDeleted().includes(d.d+'_'+i) && d.d<getHariIni() && !isChecked(d.d,i)) tung++;});});
  document.getElementById('badgeTunggakan').textContent=tung; document.getElementById('badgeTunggakan').classList.toggle('hidden',tung===0);
  if(tung===0) c2.innerHTML="<div class='bg-white border p-4 rounded-xl text-center text-green-600 font-bold text-[11px]'>✅ Tidak ada tunggakan</div>";
  else baseDays.filter(d=>d.d<getHariIni()).forEach(day=>{
    let html=""; let has=false;
    day.tasks.forEach((_,i)=>{if(!getDeleted().includes(day.d+'_'+i) && !isChecked(day.d,i)){has=true; const name=editedMap[day.d+'_'+i]||day.tasks[i]; html+="<div class='flex gap-2 py-2 px-2 border-b'><span class='flex-1 text-[10px]'>"+name+"</span><button onclick='scrollToHari("+day.d+")' class='bg-[#BE1E2D] text-white px-2 py-1 rounded text-[8px]'>Ke "+day.d+"</button></div>";}});
    if(has){const div=document.createElement('div'); div.className="bg-white p-3 rounded-xl border-l-4 border-[#BE1E2D]"; div.innerHTML="<p class='font-bold text-[11px] text-[#BE1E2D]'>HARI "+day.d+": "+day.t+"</p><div class='border rounded mt-2'>"+html+"</div>"; c2.appendChild(div);}
  });

  document.querySelectorAll('#container1 input[type=checkbox]').forEach(cb=>{
    if(cb.type!=='checkbox') return;
    if(cb.hasAttribute('onchange')) return;
    cb.addEventListener('change',e=>{
      if(!e.target.dataset.day) return;
      localStorage.setItem('chk_'+e.target.dataset.day+'_'+e.target.dataset.idx, e.target.checked?'1':'0');
      render();
    });
  });
}
loadNeed(); loadNames(); loadImgs(); render();
</script>
</body>
</html>
