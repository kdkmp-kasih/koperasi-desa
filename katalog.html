<script>
const KEY_PROD='produk-kdkmp-final';
const KEY_USERS='users-kdkmp-final';
const KEY_KAT='kategori-kdkmp-final';
const KEY_CART='cart-kdkmp-final';
const KEY_ORDER='order-kdkmp-final';
function hash(s){let h=0; for(let i=0;i<s.length;i++) h=Math.imul(31,h)+s.charCodeAt(0)+i; return h.toString(16);}
let produk = JSON.parse(localStorage.getItem(KEY_PROD)||'null');
let kategoriProduk = JSON.parse(localStorage.getItem(KEY_KAT)||'null');
let users = JSON.parse(localStorage.getItem(KEY_USERS)||'null');
let cur = JSON.parse(localStorage.getItem('curV14')||'null');
let cart = JSON.parse(localStorage.getItem(KEY_CART)||'{}');
let orders = JSON.parse(localStorage.getItem(KEY_ORDER)||'[]');
if(!kategoriProduk){kategoriProduk={"sembako":{"id":"sembako","nama":"Sembako","isSubsidi":false,"syarat":"","createdAt":Date.now()},"beras":{"id":"beras","nama":"Beras","isSubsidi":true,"syarat":"KTP Kertanegara","createdAt":Date.now()},"minyak":{"id":"minyak","nama":"Minyak","isSubsidi":false,"syarat":"","createdAt":Date.now()},"gula":{"id":"gula","nama":"Gula","isSubsidi":false,"syarat":"","createdAt":Date.now()},"bumbu":{"id":"bumbu","nama":"Bumbu","isSubsidi":false,"syarat":"","createdAt":Date.now()}}; localStorage.setItem(KEY_KAT, JSON.stringify(kategoriProduk));}
if(!produk){produk={"beras1":{"nama":"Beras SPHP 5kg Subsidi","harga":55000,"stok":100,"kat":["Sembako","Beras"],"desk":"Beras SPHP Subsidi","foto":null,"isPromo":false,"updatedAt":Date.now()},"minyak1":{"nama":"Minyak Goreng SunCo 2L","harga":37000,"stok":50,"kat":["Minyak"],"desk":"SunCo","foto":null,"isPromo":false,"updatedAt":Date.now()},"gula1":{"nama":"Gula Pasir 1kg","harga":16500,"stok":80,"kat":["Gula"],"desk":"Gulaku","foto":null,"isPromo":false,"updatedAt":Date.now()},"kecap1":{"nama":"Kecap Bango 550ml","harga":12000,"stok":60,"kat":["Bumbu"],"desk":"Bango","foto":null,"isPromo":false,"updatedAt":Date.now()},"berasPromo":{"nama":"Beras 5kg Promo","harga":65000,"stok":20,"kat":["Beras"],"desk":"Promo","foto":null,"isPromo":true,"updatedAt":Date.now()}}; localStorage.setItem(KEY_PROD, JSON.stringify(produk));}
if(!users){users={"admin1":{"id":"admin1","nama":"Admin Manajer","kontak":"08123456789","alamat":"Kertanegara","role":"admin_manajer","passHash":hash('Manajer0k3'),"createdAt":Date.now()}}; localStorage.setItem(KEY_USERS, JSON.stringify(users));}
if(!cur){cur=users["admin1"]; localStorage.setItem('curV14', JSON.stringify(cur));}
let editId=null, tempFoto=null, katEditId=null, editUserId=null;
function renderKategoriSelect(){
  const selFilter=document.getElementById('kat');
  const list=Object.values(kategoriProduk).sort((a,b)=>a.nama.localeCompare(b.nama));
  const countPerKategori={};
  Object.values(produk).forEach(p=>{const cats=Array.isArray(p.kat)?p.kat:[p.kat]; cats.forEach(c=>{countPerKategori[c]=(countPerKategori[c]||0)+1;});});
  if(selFilter){selFilter.innerHTML='<option value="">Semua Kategori</option>'+list.map(k=>{const jumlah=countPerKategori[k.nama]||0; return `<option value="${k.nama}">${k.nama} (${jumlah} produk)${k.isSubsidi?' [SUBSIDI]':''}</option>`;}).join('');}
  const box=document.getElementById('pKatCheckboxes');
  if(box){box.innerHTML=list.map(k=>{const jumlah=countPerKategori[k.nama]||0; return `<label class="flex items-center justify-between gap-1 text-[11px] bg-white border rounded-full px-3 py-2"><span class="flex items-center gap-1"><input type="checkbox" value="${k.nama}" class="kat-checkbox"> ${k.nama}${k.isSubsidi?' [SUBSIDI]':''}</span><span class="bg-[#BE1E2D] text-white text-[8px] px-2 py-0.5 rounded-full">${jumlah}</span></label>`;}).join('');}
}
function renderKategoriList(){
  const el=document.getElementById('listKategori'); if(!el) return;
  const list=Object.values(kategoriProduk).sort((a,b)=>b.createdAt-a.createdAt);
  el.innerHTML=list.map(k=>{const dipakai=Object.values(produk).filter(p=>{const cats=Array.isArray(p.kat)?p.kat:[p.kat]; return cats.includes(k.nama);}).length; return `<div class="border rounded-xl p-3 flex justify-between items-center ${k.isSubsidi?'bg-amber-50 border-amber-300':''}"><div class="flex-1"><p class="font-bold text-[12px]">${k.nama} ${k.isSubsidi?'<span class="bg-amber-300 text-[8px] px-2 py-0.5 rounded-full">SUBSIDI</span>':''}</p><p class="text-[10px] mt-1"><span class="bg-[#BE1E2D] text-white px-2 py-0.5 rounded-full text-[9px]">${dipakai} produk</span> <span class="text-slate-500 ml-1">${k.isSubsidi&&k.syarat?'| '+k.syarat:''}</span></p></div><div class="flex gap-1"><button type="button" onclick="editKategori('${k.id}')" class="bg-blue-600 text-white px-3 py-2 rounded-full text-[10px]">Edit</button><button type="button" onclick="hapusKategori('${k.id}')" class="bg-red-600 text-white px-3 py-2 rounded-full text-[10px]">Hapus</button></div></div>`;}).join('')||'<p class="text-[11px] text-center">Belum ada kategori</p>';
}
function editKategori(id){const k=kategoriProduk[id]; if(!k) return; katEditId=id; document.getElementById('katNama').value=k.nama; document.getElementById('katIsSubsidi').checked=!!k.isSubsidi; document.getElementById('katSyarat').value=k.syarat||''; document.getElementById('katSyarat').style.display=k.isSubsidi?'block':'none'; document.getElementById('saveKategoriBtn').textContent='Update Kategori'; document.getElementById('cancelKategoriBtn').style.display='block';}
function hapusKategori(id){const k=kategoriProduk[id]; if(!k) return; const dipakai=Object.values(produk).filter(p=>{const cats=Array.isArray(p.kat)?p.kat:[p.kat]; return cats.includes(k.nama);}).length; if(dipakai>0) return alert('Tidak bisa hapus '+k.nama+', masih dipakai '+dipakai+' produk.'); if(!confirm('Hapus kategori '+k.nama+'?')) return; delete kategoriProduk[id]; localStorage.setItem(KEY_KAT, JSON.stringify(kategoriProduk)); try{if(window.db) window.remove(window.ref(window.db,'kategori-kdkmp-final/'+id));}catch(e){} renderKategoriSelect(); renderKategoriList(); render();}
function saveKategori(){const nama=document.getElementById('katNama').value.trim(); const isSubsidi=document.getElementById('katIsSubsidi').checked; const syarat=document.getElementById('katSyarat').value.trim(); if(!nama) return alert('Isi nama kategori'); const id=katEditId||nama.toLowerCase().replace(/\s+/g,'_')+'_'+Date.now().toString().slice(-4); if(!katEditId && Object.values(kategoriProduk).find(k=>k.nama.toLowerCase()===nama.toLowerCase())) return alert('Kategori sudah ada'); kategoriProduk[id]={id,nama,isSubsidi,syarat:isSubsidi?(syarat||'Syarat subsidi berlaku'):'',createdAt:kategoriProduk[id]?.createdAt||Date.now(),updatedAt:Date.now()}; localStorage.setItem(KEY_KAT, JSON.stringify(kategoriProduk)); try{if(window.db) window.set(window.ref(window.db,'kategori-kdkmp-final/'+id), kategoriProduk[id]);}catch(e){} document.getElementById('katNama').value=''; document.getElementById('katIsSubsidi').checked=false; document.getElementById('katSyarat').value=''; document.getElementById('katSyarat').style.display='none'; katEditId=null; document.getElementById('saveKategoriBtn').textContent='+ Tambah Kategori'; document.getElementById('cancelKategoriBtn').style.display='none'; renderKategoriSelect(); renderKategoriList(); render();}
function cancelKategoriEdit(){katEditId=null; document.getElementById('katNama').value=''; document.getElementById('katIsSubsidi').checked=false; document.getElementById('katSyarat').value=''; document.getElementById('katSyarat').style.display='none'; document.getElementById('saveKategoriBtn').textContent='+ Tambah Kategori'; document.getElementById('cancelKategoriBtn').style.display='none';}
function render(){
  try{
    renderKategoriSelect();
    const q=(document.getElementById('q')?.value||'').toLowerCase();
    const katFil=document.getElementById('kat')?.value||'';
    let list=Object.entries(produk);
    if(q) list=list.filter(([id,p])=>p.nama.toLowerCase().includes(q));
    if(katFil) list=list.filter(([id,p])=>{const cats=Array.isArray(p.kat)?p.kat:[p.kat]; return cats.includes(katFil);});
    const promoList=list.filter(([id,p])=>p.isPromo);
    const normalList=list;
    const gridPromo=document.getElementById('gridPromo');
    if(gridPromo) gridPromo.innerHTML=promoList.map(([id,p])=>`<div class="product-card bg-white border-2 border-amber-300 rounded-2xl overflow-hidden shadow"><div class="img-box h-[140px] bg-white flex items-center justify-center relative"><img src="${p.foto||'https://via.placeholder.com/300?text='+encodeURIComponent(p.nama)}" class="w-full h-full object-contain bg-white"><span class="absolute top-2 left-2 bg-red-600 text-white text-[8px] px-2 py-1 rounded-full font-black">PROMO</span></div><div class="p-2"><p class="font-bold text-[11px] truncate">${p.nama}</p><p class="font-black text-[#BE1E2D] text-[13px]">Rp ${p.harga.toLocaleString('id-ID')}</p><p class="text-[8px] text-slate-500">${Array.isArray(p.kat)?p.kat.join(', '):p.kat}</p><div class="flex gap-1 mt-2"><button type="button" onclick="openDetail('${id}')" class="flex-1 bg-white border py-2 rounded-full text-[9px] font-bold">Lihat</button><button type="button" onclick="addCart('${id}')" class="flex-1 bg-[#BE1E2D] text-white py-2 rounded-full text-[9px] font-bold">+ Keranjang</button></div></div></div>`).join('')||'<p class="text-[10px] text-slate-400 p-2">Belum ada promo</p>';
    document.getElementById('promoArea').style.display=promoList.length===0?'none':'block';
    document.getElementById('gridToko').innerHTML=list.map(([id,p])=>`<div class="product-card bg-white rounded-2xl overflow-hidden border shadow"><div class="img-box h-[130px] bg-white flex items-center justify-center relative"><img src="${p.foto||'https://via.placeholder.com/300?text='+encodeURIComponent(p.nama)}" class="w-full h-full object-contain bg-white"><span class="absolute bottom-2 right-2 bg-[#BE1E2D] text-white text-[8px] px-2 py-1 rounded-full">Stok ${p.stok}</span></div><div class="p-2"><p class="font-bold text-[10px] truncate">${p.nama}</p><p class="font-black text-[#BE1E2D] text-[11px]">Rp ${p.harga.toLocaleString('id-ID')}</p><p class="text-[8px] text-slate-500 truncate">${Array.isArray(p.kat)?p.kat.join(', '):p.kat}</p><div class="flex gap-1 mt-2"><button type="button" onclick="openAdd('${id}')" class="flex-1 bg-blue-600 text-white py-2 rounded-full text-[8px]">Edit</button><button type="button" onclick="hapusProduk('${id}')" class="flex-1 bg-red-600 text-white py-2 rounded-full text-[8px]">Hapus</button></div></div></div>`).join('')||'<p class="text-[11px]">Belum ada produk</p>';
    document.getElementById('gridBelanja').innerHTML=normalList.map(([id,p])=>`<div class="product-card bg-white rounded-2xl overflow-hidden shadow-md border"><div class="img-box h-[150px] bg-white flex items-center justify-center relative"><img src="${p.foto||'https://via.placeholder.com/400?text='+encodeURIComponent(p.nama)}" class="w-full h-full object-contain bg-white"><span class="absolute top-2 left-2 bg-white/90 px-2 py-1 rounded-full text-[8px] font-bold shadow">${Array.isArray(p.kat)?p.kat[0]:p.kat}</span></div><div class="p-2"><p class="font-bold text-[11px] truncate">${p.nama}</p><p class="font-black text-[#BE1E2D] text-[13px] mt-1">Rp ${p.harga.toLocaleString('id-ID')}</p><p class="text-[8px] text-slate-500 truncate">${Array.isArray(p.kat)?p.kat.join(', '):p.kat} - Stok ${p.stok}</p><div class="flex gap-1 mt-2"><button type="button" onclick="openDetail('${id}')" class="flex-1 bg-slate-100 py-2 rounded-full text-[10px] font-bold">Lihat</button><button type="button" onclick="addCart('${id}')" class="flex-1 bg-[#BE1E2D] text-white py-2 rounded-full text-[10px] font-bold">+ Keranjang</button></div></div></div>`).join('')||'<div class="col-span-full bg-white p-8 rounded-2xl text-center shadow text-[13px]">Belum ada produk - Klik + Produk</div>';
    updateCartBadge(); document.getElementById('userBadge').textContent=(cur?.nama||'BELUM LOGIN')+' - '+(cur?.role||'').toUpperCase();
  }catch(e){console.error(e); alert('Error: '+e.message);}
}
function hapusProduk(id){if(!confirm('Hapus produk?')) return; delete produk[id]; localStorage.setItem(KEY_PROD, JSON.stringify(produk)); try{if(window.db) window.remove(window.ref(window.db,'produk-kdkmp-final/'+id));}catch(e){} render();}
function switchTab(t){document.getElementById('viewBelanja').classList.add('hidden'); document.getElementById('viewToko').classList.add('hidden'); document.getElementById('viewKeranjang').classList.add('hidden'); document.getElementById('viewPesanan').classList.add('hidden'); document.getElementById('viewAdmin').classList.add('hidden'); if(t==='belanja') document.getElementById('viewBelanja').classList.remove('hidden'); if(t==='toko') document.getElementById('viewToko').classList.remove('hidden'); if(t==='keranjang'){document.getElementById('viewKeranjang').classList.remove('hidden'); renderKeranjang();} if(t==='pesanan'){document.getElementById('viewPesanan').classList.remove('hidden'); renderPesanan();} if(t==='admin'){document.getElementById('viewAdmin').classList.remove('hidden');} window.scrollTo(0,0);}
function openAdd(id=null){editId=id; if(id && produk[id]){const p=produk[id]; document.getElementById('pNama').value=p.nama; document.getElementById('pHarga').value=p.harga; document.getElementById('pStok').value=p.stok; document.getElementById('pDesk').value=p.desk||''; document.getElementById('pIsPromo').checked=!!p.isPromo; document.getElementById('modalAddTitle').textContent='Edit Produk'; setTimeout(()=>{document.querySelectorAll('.kat-checkbox').forEach(cb=>{const cats=Array.isArray(p.kat)?p.kat:[p.kat]; cb.checked=cats.includes(cb.value);});},100);} else {document.getElementById('pNama').value=''; document.getElementById('pHarga').value=''; document.getElementById('pStok').value=''; document.getElementById('pDesk').value=''; document.getElementById('pIsPromo').checked=false; document.getElementById('modalAddTitle').textContent='Tambah Produk'; setTimeout(()=>{document.querySelectorAll('.kat-checkbox').forEach(cb=>cb.checked=false);},100);} tempFoto=null; openModal('modalAdd');}
function saveProd(){const nama=document.getElementById('pNama').value.trim(); const harga=parseInt(document.getElementById('pHarga').value)||0; const stok=parseInt(document.getElementById('pStok').value)||0; const desk=document.getElementById('pDesk').value.trim(); const isPromo=document.getElementById('pIsPromo').checked; const subsidiAktif=document.getElementById('pSubsidiAktif').checked; const subsidiSyarat=document.getElementById('pSubsidiSyarat').value.trim(); const checkedKats=Array.from(document.querySelectorAll('.kat-checkbox:checked')).map(cb=>cb.value); if(!nama||!harga) return alert('Isi nama & harga'); if(checkedKats.length===0) return alert('Pilih minimal 1 kategori'); const id=editId||Date.now().toString(); const old=produk[id]||{}; produk[id]={nama,harga,stok,kat:checkedKats,desk,foto:tempFoto!==null?tempFoto:(old.foto||null),isPromo,updatedAt:Date.now(), subsidi: subsidiSyarat ? {aktif: subsidiAktif, syarat: subsidiSyarat} : null }; localStorage.setItem(KEY_PROD, JSON.stringify(produk)); try{if(window.db){window.set(window.ref(window.db,'produk-kdkmp-final/'+id), produk[id]);}}catch(e){} closeAll(); render(); alert('Produk disimpan & sync ke HP!');}
document.getElementById('pFoto')?.addEventListener('change', e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{tempFoto=ev.target.result;}; r.readAsDataURL(f);});
document.getElementById('katIsSubsidi')?.addEventListener('change', e=>{document.getElementById('katSyarat').style.display=e.target.checked?'block':'none';});
function openKategoriAdmin(){renderKategoriList(); renderKategoriSelect(); openModal('kategoriAdmin');}
function openModal(id){document.getElementById(id)?.classList.add('active');}
function closeAll(){document.querySelectorAll('.modal-bg').forEach(m=>m.classList.remove('active'));}
function openDetail(id){const p=produk[id]; if(!p) return; document.getElementById('detailContent').innerHTML=`<img src="${p.foto||'https://via.placeholder.com/400?text='+encodeURIComponent(p.nama)}" class="w-full h-[200px] object-contain bg-white rounded-xl"><p class="font-black mt-2">${p.nama}</p><p class="text-[#BE1E2D] font-black">Rp ${p.harga.toLocaleString('id-ID')}</p><p class="text-[11px] text-slate-600 mt-1">Kategori: ${Array.isArray(p.kat)?p.kat.join(', '):p.kat}</p><p class="text-[11px] mt-2">${p.desk||''}</p><button onclick="addCart('${id}');closeAll();" class="w-full mt-3 bg-[#BE1E2D] text-white py-3 rounded-full font-black">+ Keranjang</button>`; openModal('modalDetail');}
function addCart(id){cart[id]=(cart[id]||0)+1; localStorage.setItem(KEY_CART, JSON.stringify(cart)); updateCartBadge(); alert('Masuk keranjang');}
function updateCartBadge(){const total=Object.values(cart).reduce((a,b)=>a+b,0); document.getElementById('cartBadge').textContent=total; document.getElementById('keranjangCountBadge').textContent=total;}
function renderKeranjang(){const el=document.getElementById('listKeranjang'); let total=0; el.innerHTML=Object.entries(cart).map(([id,qty])=>{const p=produk[id]; if(!p) return ''; const sub=p.harga*qty; total+=sub; return `<div class="bg-white p-3 rounded-xl flex justify-between items-center"><div><p class="font-bold text-[12px]">${p.nama}</p><p class="text-[10px]">Rp ${p.harga.toLocaleString('id-ID')} x ${qty}</p></div><div class="flex gap-2 items-center"><button onclick="cart['${id}']--; if(cart['${id}']<=0) delete cart['${id}']; localStorage.setItem(KEY_CART, JSON.stringify(cart)); renderKeranjang(); updateCartBadge();" class="bg-slate-200 px-2 py-1 rounded-full">-</button><span class="text-[12px] font-bold">${qty}</span><button onclick="cart['${id}']++; localStorage.setItem(KEY_CART, JSON.stringify(cart)); renderKeranjang(); updateCartBadge();" class="bg-slate-200 px-2 py-1 rounded-full">+</button></div></div>`;}).join('')||'<p class="text-[12px] text-center">Keranjang kosong</p>'; document.getElementById('totalKeranjang').textContent='Total: Rp '+total.toLocaleString('id-ID');}
function checkout(){if(Object.keys(cart).length===0) return alert('Keranjang kosong'); const id=Date.now().toString(); const items=Object.entries(cart).map(([pid,qty])=>({pid,nama:produk[pid]?.nama,qty,harga:produk[pid]?.harga})); const total=items.reduce((s,i)=>s+i.harga*i.qty,0); orders.push({id,items,total,status:'Baru',createdAt:Date.now(),user:cur?.nama}); localStorage.setItem(KEY_ORDER, JSON.stringify(orders)); cart={}; localStorage.setItem(KEY_CART, JSON.stringify(cart)); updateCartBadge(); alert('Pesanan dibuat! Total Rp '+total.toLocaleString('id-ID')); switchTab('pesanan'); renderPesanan();}
function renderPesanan(){const el=document.getElementById('listPesanan'); el.innerHTML=orders.slice().reverse().map(o=>`<div class="bg-white p-3 rounded-xl"><p class="font-bold text-[12px]">#${o.id} - Rp ${o.total.toLocaleString('id-ID')}</p><p class="text-[10px]">${o.items.map(i=>i.nama+' x'+i.qty).join(', ')}</p><p class="text-[9px] text-slate-500">${new Date(o.createdAt).toLocaleString('id-ID')} - ${o.status}</p></div>`).join('')||'<p class="text-[12px] text-center">Belum ada pesanan</p>';}
function renderPengguna(){const el=document.getElementById('listPengguna'); if(!el) return; el.innerHTML=Object.values(users).map(u=>`<div class="border rounded-xl p-2 flex justify-between items-center"><div><p class="font-bold text-[11px]">${u.nama} - ${u.role}</p><p class="text-[9px] text-slate-500">${u.kontak||''}</p></div><button onclick="openEditUser('${u.id}')" class="bg-blue-600 text-white px-3 py-1 rounded-full text-[9px]">Edit</button></div>`).join('');}
function openEditUser(id){editUserId=id; const u=users[id]; if(!u) return; document.getElementById('eNama').value=u.nama; document.getElementById('eKontak').value=u.kontak||''; document.getElementById('eAlamat').value=u.alamat||''; document.getElementById('eRole').value=u.role; document.getElementById('penggunaEditPassBaru').value=''; document.getElementById('penggunaEditPassBaru2').value=''; openModal('penggunaAdmin');}
function saveEditUser(){const u=users[editUserId]; if(!u) return; if(cur?.role!=='admin_manajer') return alert('Hanya Admin Manajer'); const namaBaru=document.getElementById('eNama').value.trim(); const passBaru=document.getElementById('penggunaEditPassBaru').value.trim(); const passBaru2=document.getElementById('penggunaEditPassBaru2').value.trim(); if(!namaBaru) return alert('Nama kosong'); let passChanged=false; if(passBaru!==''){if(passBaru.length<4) return alert('Password minimal 4'); if(passBaru!==passBaru2) return alert('Ulang password tidak sama'); u.passHash=hash(passBaru); passChanged=true;} u.nama=namaBaru; u.kontak=document.getElementById('eKontak').value.trim(); u.alamat=document.getElementById('eAlamat').value.trim(); u.role=document.getElementById('eRole').value; localStorage.setItem(KEY_USERS, JSON.stringify(users)); if(cur && cur.id===editUserId){cur.nama=u.nama; cur.kontak=u.kontak; cur.alamat=u.alamat; cur.role=u.role; if(passChanged) cur.passHash=u.passHash; localStorage.setItem('curV14', JSON.stringify(cur));} try{if(window.db) window.update(window.ref(window.db,'users-kdkmp-final/'+editUserId), u);}catch(e){} closeAll(); renderPengguna(); render(); alert('Berhasil update user: '+u.nama+(passChanged?' + password baru: '+passBaru:' + password tetap'));}
function logout(){localStorage.removeItem('curV14'); location.reload();}
setTimeout(()=>{try{if(window.db){window.onValue(window.ref(window.db,'produk-kdkmp-final'), snap=>{const v=snap.val(); if(v && Object.keys(v).length>0){const localCount=Object.keys(produk).length; const fbCount=Object.keys(v).length; if(fbCount>=localCount || localCount===0){localStorage.setItem(KEY_PROD, JSON.stringify(v)); produk=v; render();}}}); window.onValue(window.ref(window.db,'kategori-kdkmp-final'), snap=>{const v=snap.val(); if(v && Object.keys(v).length>0){localStorage.setItem(KEY_KAT, JSON.stringify(v)); kategoriProduk=v; renderKategoriSelect(); renderKategoriList(); render();}});}}catch(e){}},800);
render();
</script>
</body>
</html>
