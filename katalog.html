<script>
// ===== V13 FIX KLIK - TANPA MODULE BLOCKING =====
let editId=null, detailId=null, cart={}, view='belanja', tempFoto=null, tempLogo=null, cur=null;
let produk = JSON.parse(localStorage.getItem('prodV13')||'null') || {
  "1":{nama:"Beras Premium 5kg", harga:65000, stok:50, kat:"Beras", desk:"Beras pulen asli", foto:null, isPromo:true, tagPerubahan:"", updatedAt:Date.now()},
  "2":{nama:"Minyak Goreng 2L", harga:32000, stok:30, kat:"Minyak", desk:"Minyak bersih", foto:null, isPromo:false, tagPerubahan:"", updatedAt:Date.now()},
  "3":{nama:"Gula Pasir 1kg", harga:16500, stok:40, kat:"Gula", desk:"Gula manis", foto:null, isPromo:false, tagPerubahan:"", updatedAt:Date.now()},
  "4":{nama:"Bundling Sembako Hemat", harga:95000, stok:20, kat:"Bundling", desk:"Beras 3kg + Minyak 1L + Gula 1kg", foto:null, isPromo:true, tagPerubahan:"PROMO", updatedAt:Date.now()}
};
let users = JSON.parse(localStorage.getItem('usersV13')||'{}');
let config = JSON.parse(localStorage.getItem('configV13')||'{}');
let orders = JSON.parse(localStorage.getItem('ordersV13')||'{}');
cur = JSON.parse(localStorage.getItem('curV13')||'null');

function hash(p){let h=0;for(let i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0;}return 'h'+Math.abs(h)+btoa(p).slice(0,4);}
function ensureManajer(){
  if(!Object.values(users).find(u=>u.nama==='Admin Manajer')){
    const id='admin_manajer_001';
    users[id]={id,nama:'Admin Manajer',kontak:'Admin Manajer',alamat:'Kantor',passHash:hash('Manajer0k3'),role:'admin_manajer',totalBelanja:0,createdAt:new Date().toISOString()};
    localStorage.setItem('usersV13', JSON.stringify(users));
  }
}
ensureManajer();

function openAll(){}
function closeAllModals(){document.querySelectorAll('#logoAdmin,#auth,#add,#detail,#cart,#pengguna').forEach(el=>el.style.display='none');}
document.querySelectorAll('.btnClose').forEach(btn=>btn.addEventListener('click', closeAllModals));

function switchView(v){
  if(v==='toko' && !(cur?.role==='admin_manajer'||cur?.role==='admin_karyawan')){alert('Toko khusus Manajer'); return;}
  view=v;
  document.getElementById('viewToko').style.display=v==='toko'?'block':'none';
  document.getElementById('viewBelanja').style.display=v==='belanja'?'block':'none';
  document.getElementById('bToko').className=v==='toko'?'bg-white text-[#BE1E2D] px-4 py-2 rounded-full text-[11px] font-bold':'bg-black/30 px-4 py-2 rounded-full text-[11px] font-bold';
  document.getElementById('bBelanja').className=v==='belanja'?'bg-white text-[#BE1E2D] px-4 py-2 rounded-full text-[12px] font-bold shadow':'bg-black/30 px-4 py-2 rounded-full text-[11px] font-bold';
  render();
}
function openAuth(){
  document.getElementById('auth').style.display='flex';
  document.getElementById('formLogin').style.display='block';
  document.getElementById('formDaftar').style.display='none';
  document.getElementById('tAuth').textContent='Masuk Akun';
}
function toDaftar(){document.getElementById('formLogin').style.display='none'; document.getElementById('formDaftar').style.display='block'; document.getElementById('tAuth').textContent='Daftar Konsumen';}
function toLogin(){document.getElementById('formDaftar').style.display='none'; document.getElementById('formLogin').style.display='block'; document.getElementById('tAuth').textContent='Masuk Akun';}
function doLogin(){
  const u=document.getElementById('lUser').value.trim(); const p=document.getElementById('lPass').value.trim();
  const m=document.getElementById('lMsg'); if(!u||!p){m.textContent='Isi username & pass';return;}
  const f=Object.values(users).find(x=>(x.nama.toLowerCase()===u.toLowerCase()||(x.kontak||'').toLowerCase()===u.toLowerCase())&&x.passHash===hash(p));
  if(!f){m.textContent='Salah username/password';return;}
  cur=f; localStorage.setItem('curV13', JSON.stringify(cur)); closeAllModals(); afterLogin();
}
function doDaftar(){
  const nama=document.getElementById('dNama').value.trim(); const kontak=document.getElementById('dKontak').value.trim(); const alamat=document.getElementById('dAlamat').value.trim(); const pass=document.getElementById('dPass').value.trim(); const pass2=document.getElementById('dPass2').value.trim(); const m=document.getElementById('dMsg');
  if(!nama||!kontak||!alamat||!pass){m.textContent='Semua wajib';return;} if(pass!==pass2){m.textContent='Pass tidak sama';return;}
  if(Object.values(users).find(u=> (u.kontak||'').toLowerCase()===kontak.toLowerCase())){m.textContent='Sudah terdaftar';return;}
  const id=Date.now().toString(); users[id]={id,nama,kontak,alamat,passHash:hash(pass),role:'konsumen',totalBelanja:0,createdAt:new Date().toISOString()};
  localStorage.setItem('usersV13', JSON.stringify(users)); m.textContent='✅ Sukses! Silakan Masuk'; setTimeout(()=>toLogin(),800);
}
function afterLogin(){
  document.getElementById('badge').classList.remove('hidden'); document.getElementById('badge').textContent=cur.role.replace('_',' ').toUpperCase();
  document.getElementById('btnMasuk').style.display='none'; document.getElementById('btnKeluar').style.display='block';
  if(cur.role==='admin_manajer'){document.getElementById('bToko').style.display='block'; document.getElementById('addBtn').style.display='block';}
  if(cur.role==='admin_manajer'||cur.role==='admin_karyawan'){document.getElementById('bToko').style.display='block';}
  render();
}
function logout(){localStorage.removeItem('curV13'); location.reload();}
function openLogoAdmin(){if(cur?.role!=='admin_manajer'){alert('Hanya Manajer'); return;} document.getElementById('logoAdmin').style.display='flex';}
function saveLogo(){if(!tempLogo) return alert('Pilih logo dulu'); config.logo=tempLogo; localStorage.setItem('configV13', JSON.stringify(config)); renderLogo(); closeAllModals();}
function deleteLogo(){if(!confirm('Hapus logo?')) return; config.logo=null; localStorage.setItem('configV13', JSON.stringify(config)); renderLogo(); closeAllModals();}
function renderLogo(){const logo=config.logo; const img=document.getElementById('logoImg'); const def=document.getElementById('logoDefault'); if(logo){img.src=logo; img.style.display='block'; def.style.display='none';} else {img.style.display='none'; def.style.display='block';}}
document.getElementById('logoFile')?.addEventListener('change', function(e){const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=ev=>{const im=new Image(); im.onload=()=>{const c=document.createElement('canvas'); let w=im.width,h=im.height; if(w>400){h=h*(400/w);w=400;} c.width=w;c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); tempLogo=c.toDataURL('image/png',0.8); document.getElementById('logoPrevImg').src=tempLogo; document.getElementById('logoPrevBox').classList.remove('hidden');}; im.src=ev.target.result;}; r.readAsDataURL(file);});

function openAdd(id=null){if(cur?.role!=='admin_manajer'){alert('Hanya Manajer bisa tambah produk'); return;} editId=id; document.getElementById('add').style.display='flex'; document.getElementById('addTitle').textContent=id?'Edit Produk':'Tambah Produk'; if(id&&produk[id]){const p=produk[id]; document.getElementById('pNama').value=p.nama; document.getElementById('pHarga').value=p.harga; document.getElementById('pStok').value=p.stok; document.getElementById('pKat').value=p.kat; document.getElementById('pDesk').value=p.desk||''; document.getElementById('pIsPromo').checked=!!p.isPromo; tempFoto=p.foto||null; if(p.foto){document.getElementById('prevImg').src=p.foto; document.getElementById('prevBox').classList.remove('hidden');}} else {['pNama','pHarga','pStok','pDesk'].forEach(i=>document.getElementById(i).value=''); document.getElementById('pIsPromo').checked=false; tempFoto=null; document.getElementById('prevBox').classList.add('hidden'); document.getElementById('pFoto').value='';}}
function saveProd(){const nama=document.getElementById('pNama').value.trim(); const harga=parseInt(document.getElementById('pHarga').value)||0; const stok=parseInt(document.getElementById('pStok').value)||0; const kat=document.getElementById('pKat').value; const desk=document.getElementById('pDesk').value.trim(); const isPromo=document.getElementById('pIsPromo').checked; if(!nama||!harga) return alert('Isi nama & harga'); const id=editId||Date.now().toString(); const old=produk[id]||{}; const tag=(old.harga&&old.harga!==harga)?'HARGA BARU':(old.stok!==undefined&&old.stok!==stok)?'STOK UPDATE':''; produk[id]={nama,harga,stok,kat,desk,foto:tempFoto!==null?tempFoto:(old.foto||null),isPromo,tagPerubahan:tag,updatedAt:Date.now()}; localStorage.setItem('prodV13', JSON.stringify(produk)); closeAllModals(); render();}
document.getElementById('pFoto')?.addEventListener('change', function(e){const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=ev=>{const im=new Image(); im.onload=()=>{const c=document.createElement('canvas'); let w=im.width,h=im.height; if(w>800){h=h*(800/w);w=800;} c.width=w;c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); tempFoto=c.toDataURL('image/jpeg',0.65); document.getElementById('prevImg').src=tempFoto; document.getElementById('prevBox').classList.remove('hidden');}; im.src=ev.target.result;}; r.readAsDataURL(file);});

function openDetail(id){detailId=id; const p=produk[id]; if(!p) return; document.getElementById('dNama').textContent=p.nama; document.getElementById('dFoto').src=p.foto||'https://via.placeholder.com/400x300?text='+encodeURIComponent(p.nama); document.getElementById('dKat').textContent=p.kat+(p.isPromo?' • PROMO':''); document.getElementById('dHarga').textContent='Rp '+Number(p.harga).toLocaleString('id-ID'); document.getElementById('dStok').textContent='Stok: '+p.stok; document.getElementById('dDesk').textContent=p.desk||''; document.getElementById('dTag').innerHTML=p.tagPerubahan?`<span class="bg-yellow-200 px-3 py-1 rounded-full font-bold">${p.tagPerubahan}</span>`:''; document.getElementById('detail').style.display='flex';}
function addCart(id){cart[id]=(cart[id]||0)+1; if(cart[id]>produk[id].stok) cart[id]=produk[id].stok; updateCart(); if(view!=='belanja') switchView('belanja');}
function addCartFromDetail(){if(!detailId) return; addCart(detailId); closeAllModals();}
function updateCart(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0); const list=document.getElementById('cartList'); let sub=0; list.innerHTML=Object.entries(cart).map(([id,q])=>{const p=produk[id]; if(!p) return ''; const s=p.harga*q; sub+=s; return `<div class="flex gap-2 items-center border-b py-2"><div class="flex-1"><p class="font-bold text-[12px]">${p.nama}</p><p class="text-[11px]">x ${q} = Rp ${s.toLocaleString()}</p></div><button onclick="delete cart['${id}']; updateCart()" class="text-red-600 text-[12px]">X</button></div>`;}).join('')||'<p class="text-[11px] text-slate-500">Kosong</p>'; document.getElementById('cartSub').textContent='Rp '+sub.toLocaleString(); document.getElementById('cartTotal').textContent='Rp '+sub.toLocaleString();}
function openCart(){document.getElementById('cart').style.display='flex'; updateCart();}
function doCheckout(){if(Object.keys(cart).length===0) return alert('Kosong'); if(!cur){alert('Login dulu untuk checkout'); closeAllModals(); openAuth(); return;} const ambil=document.querySelector('input[name="ambil"]:checked').value; const note=document.getElementById('note').value.trim(); const sub=Object.entries(cart).reduce((s,[id,q])=>s+(produk[id]?.harga||0)*q,0); const order={id:Date.now().toString(), userNama:cur.nama, total:sub, ambil, note, status:'antrian', createdAt:Date.now(), cart}; orders[order.id]=order; localStorage.setItem('ordersV13', JSON.stringify(orders)); cart={}; updateCart(); closeAllModals(); alert('✅ Pesanan masuk! Total Rp '+sub.toLocaleString()+' - '+ambil);}

function render(){
  const q=(document.getElementById('q').value||'').toLowerCase(); const kat=document.getElementById('kat').value;
  const list=Object.entries(produk).filter(([id,p])=>{ if(kat&&p.kat!==kat) return false; if(q&&!p.nama.toLowerCase().includes(q)) return false; return true;});
  const promoList=list.filter(([id,p])=>p.isPromo||p.kat==='Promo'||p.kat==='Bundling');
  const normalList=list.filter(([id,p])=>!promoList.some(([pid])=>pid===id));
  document.getElementById('gridPromo').innerHTML=promoList.map(([id,p])=>`<div class="bg-gradient-to-br from-yellow-50 to-amber-100 border-2 border-amber-300 rounded-2xl overflow-hidden shadow"><div class="h-[140px] bg-white flex items-center justify-center relative">${p.foto?`<img src="${p.foto}" class="w-full h-full object-cover">`:`<div class="text-[40px]">🎁</div>`}<span class="absolute top-2 left-2 bg-red-600 text-white text-[8px] px-3 py-1 rounded-full font-black">PROMO</span><span class="absolute bottom-2 right-2 bg-[#BE1E2D] text-white text-[9px] px-2 py-1 rounded-full">Stok ${p.stok}</span></div><div class="p-3"><p class="font-bold text-[12px]">${p.nama}</p><p class="font-black text-[#BE1E2D] text-[14px]">Rp ${p.harga.toLocaleString('id-ID')}</p><div class="flex gap-2 mt-2"><button onclick="openDetail('${id}')" class="flex-1 bg-white border py-2 rounded-full text-[10px] font-bold">Lihat</button><button onclick="addCart('${id}')" class="flex-1 bg-[#BE1E2D] text-white py-2 rounded-full text-[10px] font-bold">+ Keranjang</button></div></div></div>`).join('')||'<p class="text-[11px] text-slate-500 col-span-full bg-white p-4 rounded-xl text-center">Belum ada promo - Admin centang Promo saat tambah</p>';
  document.getElementById('promoArea').style.display=promoList.length===0?'none':'block';
  document.getElementById('gridToko').innerHTML=list.map(([id,p])=>`<div class="bg-white rounded-2xl overflow-hidden border shadow"><div class="h-[130px] bg-slate-100 flex items-center justify-center relative">${p.foto?`<img src="${p.foto}" class="w-full h-full object-cover">`:`<span class="text-[24px]">📦</span>`}<span class="absolute bottom-2 right-2 bg-[#BE1E2D] text-white text-[8px] px-2 py-1 rounded-full">Stok ${p.stok}</span></div><div class="p-3"><p class="font-bold text-[11px] truncate">${p.nama}</p><p class="font-black text-[#BE1E2D] text-[12px]">Rp ${p.harga.toLocaleString('id-ID')}</p><div class="flex gap-1 mt-2"><button onclick="openAdd('${id}')" class="flex-1 bg-blue-600 text-white py-2 rounded-full text-[9px] font-bold">Edit</button><button onclick="hapusProd('${id}')" class="flex-1 bg-red-600 text-white py-2 rounded-full text-[9px] font-bold">Hapus</button></div></div></div>`).join('');
  document.getElementById('gridBelanja').innerHTML=normalList.map(([id,p])=>`<div class="bg-white rounded-2xl overflow-hidden shadow-md border hover:shadow-xl transition-all hover:-translate-y-1"><div class="h-[160px] md:h-[200px] bg-slate-50 flex items-center justify-center relative cursor-pointer" onclick="openDetail('${id}')">${p.foto?`<img src="${p.foto}" class="w-full h-full object-cover">`:`<span class="text-[40px]">🛒</span>`}<span class="absolute top-3 left-3 bg-white/90 px-3 py-1 rounded-full text-[9px] font-bold shadow">${p.kat}</span>${p.tagPerubahan?`<span class="absolute top-3 right-3 bg-yellow-300 text-black text-[8px] px-2 py-1 rounded-full font-bold">${p.tagPerubahan}</span>`:''}</div><div class="p-3 md:p-4"><p class="font-bold text-[12px] md:text-[14px]">${p.nama}</p><p class="font-black text-[#BE1E2D] text-[15px] md:text-[18px] mt-1">Rp ${p.harga.toLocaleString('id-ID')}</p><p class="text-[10px] text-slate-500 mt-1">Stok ${p.stok}</p><div class="flex gap-2 mt-3"><button onclick="openDetail('${id}')" class="flex-1 bg-slate-100 py-2.5 rounded-full text-[11px] font-bold">Lihat</button><button onclick="addCart('${id}')" class="flex-1 bg-[#BE1E2D] text-white py-2.5 rounded-full text-[11px] font-bold">+ Keranjang</button></div></div></div>`).join('')||'<div class="col-span-full bg-white p-8 rounded-2xl text-center shadow"><p class="text-[40px]">🛒</p><p class="font-bold text-[13px] mt-2">Katalog kosong</p></div>';
}
function hapusProd(id){if(!confirm('Hapus?')) return; delete produk[id]; localStorage.setItem('prodV13', JSON.stringify(produk)); render();}
function openPengguna(){document.getElementById('pengguna').style.display='flex'; renderPengguna();}
function renderPengguna(){const el=document.getElementById('listPengguna'); el.innerHTML=Object.values(users).map(u=>`<div class="border rounded-xl p-3"><p class="font-bold text-[11px]">${u.nama} <span class="text-[8px] bg-slate-100 px-2 py-0.5 rounded-full">${u.role}</span></p><p class="text-[10px]">${u.kontak}</p><div class="flex gap-1 mt-2"><button onclick="if(confirm('Hapus?')){delete users['${u.id}']; localStorage.setItem('usersV13', JSON.stringify(users)); renderPengguna();}" class="flex-1 bg-red-600 text-white py-1.5 rounded-full text-[9px]">Hapus</button></div></div>`).join('');}
function addKaryawan(){const nama=document.getElementById('kNama').value.trim(); const kontak=document.getElementById('kKontak').value.trim(); const alamat=document.getElementById('kAlamat').value.trim(); const pass=document.getElementById('kPass').value.trim(); if(!nama||!kontak||!pass) return alert('Isi semua'); const id=Date.now().toString(); users[id]={id,nama,kontak,alamat,passHash:hash(pass),role:'admin_karyawan',totalBelanja:0,createdAt:new Date().toISOString()}; localStorage.setItem('usersV13', JSON.stringify(users)); alert('Karyawan ditambah'); document.getElementById('kNama').value=''; document.getElementById('kKontak').value=''; document.getElementById('kPass').value=''; document.getElementById('kAlamat').value=''; renderPengguna();}

// EVENT LISTENERS PASTI KLIK
document.getElementById('bBelanja').addEventListener('click', ()=>switchView('belanja'));
document.getElementById('bToko').addEventListener('click', ()=>switchView('toko'));
document.getElementById('btnMasuk').addEventListener('click', openAuth);
document.getElementById('btnKeluar').addEventListener('click', logout);
document.getElementById('cartBtn').addEventListener('click', openCart);
document.getElementById('addBtn').addEventListener('click', ()=>openAdd());
document.getElementById('logoBox').addEventListener('click', openLogoAdmin);
document.getElementById('saveLogoBtn').addEventListener('click', saveLogo);
document.getElementById('delLogoBtn').addEventListener('click', deleteLogo);
document.getElementById('doLoginBtn').addEventListener('click', doLogin);
document.getElementById('toDaftarBtn').addEventListener('click', toDaftar);
document.getElementById('toLoginBtn').addEventListener('click', toLogin);
document.getElementById('doDaftarBtn').addEventListener('click', doDaftar);
document.getElementById('saveProdBtn').addEventListener('click', saveProd);
document.getElementById('addCartDetailBtn').addEventListener('click', addCartFromDetail);
document.getElementById('checkoutBtn').addEventListener('click', doCheckout);
document.getElementById('addKaryawanBtn')?.addEventListener('click', addKaryawan);
document.getElementById('q').addEventListener('input', render);
document.getElementById('kat').addEventListener('change', render);

// INIT
localStorage.setItem('prodV13', JSON.stringify(produk));
if(cur){document.getElementById('btnMasuk').style.display='none'; document.getElementById('btnKeluar').style.display='block'; afterLogin();}
render(); renderLogo();
