<script>
let mode='login', editId=null, editUserId=null, detailId=null, cart={}, view='toko';
let produk=JSON.parse(localStorage.getItem('prodV8')||'{}');
let users=JSON.parse(localStorage.getItem('usersV8')||'{}');
let cur=JSON.parse(localStorage.getItem('curV8')||'null');
function hash(p){let h=0;for(let i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0;}return 'h'+Math.abs(h)+btoa(p).slice(0,4);}

// KOSONGKAN PENCARIAN SAAT LOAD - FIX DARI SCREENSHOT
window.addEventListener('load',()=>{document.getElementById('q').value='';});

// BUAT ADMIN MANAJER OTOMATIS
function ensureManajer(){
  const manajerExists=Object.values(users).find(u=>u.nama==='Admin Manajer');
  if(!manajerExists){
    const id='admin_manajer_001';
    users[id]={id, nama:'Admin Manajer', kontak:'Admin Manajer', alamat:'Kantor Gerai KDKMP Kasih', passHash:hash('Manajer0k3'), role:'admin_manajer', createdAt:new Date().toISOString()};
    localStorage.setItem('usersV8', JSON.stringify(users));
    try{ if(window.db) window.set(window.ref(window.db,'users-katalog-V8/'+id), users[id]); }catch(e){}
  }
}
ensureManajer();

function toDaftar(){document.getElementById('formLogin').style.display='none'; document.getElementById('formDaftar').style.display='block'; document.getElementById('tAuth').textContent='Daftar Konsumen';}
function toLogin(){document.getElementById('formDaftar').style.display='none'; document.getElementById('formLogin').style.display='block'; document.getElementById('tAuth').textContent='Masuk Akun';}
function openAuth(){document.getElementById('auth').style.display='flex'; toLogin();}
function closeAuth(){document.getElementById('auth').style.display='none';}
function switchView(v){view=v; document.getElementById('viewToko').classList.toggle('hidden', v!=='toko'); document.getElementById('viewBelanja').classList.toggle('hidden', v!=='belanja'); document.getElementById('bToko').className=v==='toko'?'bg-white text-[#BE1E2D] px-2 py-1.5 rounded-full text-[9px] font-bold':'bg-black/20 px-2 py-1.5 rounded-full text-[9px] font-bold'; document.getElementById('bBelanja').className=v==='belanja'?'bg-white text-[#BE1E2D] px-2 py-1.5 rounded-full text-[9px] font-bold':'bg-black/20 px-2 py-1.5 rounded-full text-[9px] font-bold'; render();}

function doLogin(){
  const user=document.getElementById('lUser').value.trim(); const pass=document.getElementById('lPass').value.trim(); const msg=document.getElementById('lMsg');
  if(!user||!pass){msg.textContent='Isi username & password'; return;}
  const f=Object.values(users).find(u=> (u.nama.toLowerCase()===user.toLowerCase() || (u.kontak||'').toLowerCase()===user.toLowerCase()) && u.passHash===hash(pass));
  if(!f){msg.textContent='Username / Password salah'; return;}
  cur=f; localStorage.setItem('curV8', JSON.stringify(cur)); closeAuth(); afterLogin();
}
function doDaftar(){
  const nama=document.getElementById('dNama').value.trim(); const kontak=document.getElementById('dKontak').value.trim(); const alamat=document.getElementById('dAlamat').value.trim(); const pass=document.getElementById('dPass').value.trim(); const pass2=document.getElementById('dPass2').value.trim(); const msg=document.getElementById('dMsg');
  if(!nama||!kontak||!alamat||!pass){msg.textContent='Semua wajib diisi *'; return;}
  if(pass.length<4){msg.textContent='Password min 4'; return;}
  if(pass!==pass2){msg.textContent='Password tidak sama'; return;}
  if(Object.values(users).find(u=> (u.kontak||'').toLowerCase()===kontak.toLowerCase() || u.nama.toLowerCase()===nama.toLowerCase())){msg.textContent='Nama / Email/No.HP sudah terdaftar'; return;}
  const id=Date.now().toString();
  users[id]={id, nama, kontak, alamat, passHash:hash(pass), role:'konsumen', createdAt:new Date().toISOString()};
  localStorage.setItem('usersV8', JSON.stringify(users));
  try{ if(window.db) window.set(window.ref(window.db,'users-katalog-V8/'+id), users[id]); }catch(e){}
  msg.textContent='✅ Daftar sukses! Silakan Masuk';
  setTimeout(()=>{toLogin();},800);
}

function afterLogin(){
  document.getElementById('badge').classList.remove('hidden'); document.getElementById('badge').textContent=cur.role.toUpperCase().replace('_',' ');
  document.getElementById('btnMasuk').style.display='none'; document.getElementById('btnKeluar').style.display='block';
  if(cur.role==='admin_manajer' || cur.role==='admin_karyawan'){document.getElementById('addBtn').style.display='block'; document.getElementById('btnPengguna').style.display='block';}
  if(cur.role==='admin_manajer'){document.getElementById('manajerPanel').style.display='block';}
  render(); renderPengguna();
}
function logout(){localStorage.removeItem('curV8'); location.reload();}
function openPengguna(){document.getElementById('pengguna').style.display='flex'; renderPengguna();}

function renderPengguna(){
  const el=document.getElementById('listPengguna');
  const list=Object.values(users).sort((a,b)=>a.role==='admin_manajer'?-1:1);
  el.innerHTML=list.map(u=>`<div class="border rounded-xl p-3"><div class="flex justify-between"><div><p class="font-bold text-[11px]">${u.nama} <span class="text-[7px] px-2 py-0.5 rounded-full ${u.role==='admin_manajer'?'bg-red-600 text-white':u.role==='admin_karyawan'?'bg-amber-300 text-black':'bg-slate-100'}">${u.role}</span></p><p class="text-[10px] text-slate-600">${u.kontak||''}</p><p class="text-[9px] text-slate-500">${u.alamat||''}</p></div></div><div class="flex gap-1 mt-2"><button onclick="openEditUser('${u.id}')" class="flex-1 bg-blue-600 text-white py-1.5 rounded-full text-[8px] font-bold">✏️ Edit</button><button onclick="hapusUser('${u.id}')" class="flex-1 bg-red-600 text-white py-1.5 rounded-full text-[8px] font-bold">🗑️ Hapus</button></div></div>`).join('')||'<p class="text-center text-[11px] text-slate-500">Belum ada pengguna</p>';
}
function openEditUser(id){
  const u=users[id]; if(!u) return;
  // hanya manajer bisa edit role manajer, karyawan tidak bisa edit manajer
  if(cur.role==='admin_karyawan' && u.role==='admin_manajer') return alert('Karyawan tidak bisa edit Admin Manajer');
  editUserId=id; document.getElementById('eNama').value=u.nama; document.getElementById('eKontak').value=u.kontak||''; document.getElementById('eAlamat').value=u.alamat||''; document.getElementById('eRole').value=u.role; document.getElementById('ePass').value=''; document.getElementById('editUser').style.display='flex';
  // karyawan tidak bisa ubah role jadi manajer
  if(cur.role==='admin_karyawan'){document.getElementById('eRole').innerHTML='<option value="konsumen">Konsumen</option><option value="admin_karyawan">Admin Karyawan</option>'; if(u.role==='admin_manajer') document.getElementById('eRole').innerHTML='<option value="admin_manajer">Admin Manajer</option>';}
  else {document.getElementById('eRole').innerHTML='<option value="konsumen">Konsumen</option><option value="admin_karyawan">Admin Karyawan</option><option value="admin_manajer">Admin Manajer</option>'; document.getElementById('eRole').value=u.role;}
}
function saveEditUser(){
  const u=users[editUserId]; if(!u) return;
  const nama=document.getElementById('eNama').value.trim(); const kontak=document.getElementById('eKontak').value.trim(); const alamat=document.getElementById('eAlamat').value.trim(); const role=document.getElementById('eRole').value; const pass=document.getElementById('ePass').value.trim();
  if(!nama||!kontak) return alert('Nama & kontak wajib');
  // cegah karyawan jadi manajer
  if(cur.role==='admin_karyawan' && role==='admin_manajer') return alert('Karyawan tidak bisa jadi Manajer');
  u.nama=nama; u.kontak=kontak; u.alamat=alamat;
  if(cur.role==='admin_manajer') u.role=role;
  if(pass){ if(pass.length<4) return alert('Password min 4'); u.passHash=hash(pass); }
  localStorage.setItem('usersV8', JSON.stringify(users));
  try{ if(window.db) window.update(window.ref(window.db,'users-katalog-V8/'+editUserId), u); }catch(e){}
  document.getElementById('editUser').style.display='none'; renderPengguna(); render();
}
function hapusUser(id){
  if(id==='admin_manajer_001') return alert('Admin Manajer utama tidak bisa dihapus');
  if(cur.id===id) return alert('Tidak bisa hapus akun sendiri');
  if(cur.role==='admin_karyawan' && users[id].role==='admin_manajer') return alert('Karyawan tidak bisa hapus Manajer');
  if(!confirm('Hapus pengguna ini permanen?')) return;
  delete users[id]; localStorage.setItem('usersV8', JSON.stringify(users));
  try{ if(window.db) window.remove(window.ref(window.db,'users-katalog-V8/'+id)); }catch(e){}
  renderPengguna();
}
function addKaryawan(){
  if(cur.role!=='admin_manajer') return alert('Hanya Admin Manajer');
  const nama=document.getElementById('kNama').value.trim(); const kontak=document.getElementById('kKontak').value.trim(); const alamat=document.getElementById('kAlamat').value.trim(); const pass=document.getElementById('kPass').value.trim();
  if(!nama||!kontak||!pass) return alert('Isi semua');
  if(Object.values(users).find(u=>u.kontak===kontak || u.nama===nama)) return alert('Sudah ada');
  const id=Date.now().toString();
  users[id]={id, nama, kontak, alamat, passHash:hash(pass), role:'admin_karyawan', createdAt:new Date().toISOString()};
  localStorage.setItem('usersV8', JSON.stringify(users));
  try{ if(window.db) window.set(window.ref(window.db,'users-katalog-V8/'+id), users[id]); }catch(e){}
  alert('Admin Karyawan ditambah'); ['kNama','kKontak','kAlamat','kPass'].forEach(i=>document.getElementById(i).value=''); renderPengguna();
}

// PRODUK
let tempFoto=null;
document.getElementById('pFoto').addEventListener('change', function(e){
 const file=e.target.files[0]; if(!file) return;
 const r=new FileReader(); r.onload=ev=>{
  const img=new Image(); img.onload=()=>{
   const c=document.createElement('canvas'); let w=img.width, h=img.height; if(w>800){h=h*(800/w); w=800;} c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
   tempFoto=c.toDataURL('image/jpeg',0.65);
   document.getElementById('prevImg').src=tempFoto; document.getElementById('prevBox').classList.remove('hidden');
  }; img.src=ev.target.result;
 }; r.readAsDataURL(file);
});
function hapusFoto(){tempFoto=null; document.getElementById('prevBox').classList.add('hidden'); document.getElementById('pFoto').value='';}
function openAdd(id=null){editId=id; document.getElementById('add').style.display='flex'; document.getElementById('addTitle').textContent=id?'Edit Produk + Foto':'Tambah Produk + Foto'; if(id && produk[id]){const p=produk[id]; document.getElementById('pNama').value=p.nama; document.getElementById('pHarga').value=p.harga; document.getElementById('pStok').value=p.stok; document.getElementById('pKat').value=p.kat; document.getElementById('pDesk').value=p.desk||''; tempFoto=p.foto||null; if(p.foto){document.getElementById('prevImg').src=p.foto; document.getElementById('prevBox').classList.remove('hidden');} else {document.getElementById('prevBox').classList.add('hidden');}} else {['pNama','pHarga','pStok','pDesk'].forEach(i=>document.getElementById(i).value=''); tempFoto=null; document.getElementById('prevBox').classList.add('hidden'); document.getElementById('pFoto').value='';}}
function closeAdd(){document.getElementById('add').style.display='none'; editId=null; tempFoto=null;}
function saveProd(){const nama=document.getElementById('pNama').value.trim(); const harga=parseInt(document.getElementById('pHarga').value)||0; const stok=parseInt(document.getElementById('pStok').value)||0; const kat=document.getElementById('pKat').value; const desk=document.getElementById('pDesk').value.trim(); if(!nama||!harga){document.getElementById('saveMsg').textContent='Isi nama & harga'; return;} const id=editId||Date.now().toString(); const data={nama,harga,stok,kat,desk,foto:tempFoto!==null?tempFoto:(produk[id]?.foto||null)}; produk[id]=data; localStorage.setItem('prodV8', JSON.stringify(produk)); document.getElementById('saveMsg').textContent='✅ Tersimpan!'; try{ if(window.db) window.set(window.ref(window.db,'produk-katalog-V8/'+id), data);}catch(e){} setTimeout(()=>{closeAdd(); render();},600);}
function ubahStok(id,d){produk[id].stok=(produk[id].stok||0)+d; if(produk[id].stok<0) produk[id].stok=0; localStorage.setItem('prodV8', JSON.stringify(produk)); try{ if(window.db) window.update(window.ref(window.db,'produk-katalog-V8/'+id), {stok:produk[id].stok}); }catch(e){} render();}
function hapusProd(id){if(!confirm('Hapus produk?')) return; delete produk[id]; localStorage.setItem('prodV8', JSON.stringify(produk)); try{ if(window.db) window.remove(window.ref(window.db,'produk-katalog-V8/'+id)); }catch(e){} render();}
function openDetail(id){detailId=id; const p=produk[id]; if(!p) return; document.getElementById('dNama').textContent=p.nama; document.getElementById('dFoto').src=p.foto||'https://via.placeholder.com/300x200?text=No+Foto'; document.getElementById('dKat').textContent=p.kat; document.getElementById('dHarga').textContent='Rp '+Number(p.harga).toLocaleString('id-ID'); document.getElementById('dStok').textContent='Stok: '+p.stok; document.getElementById('dDesk').textContent=p.desk||''; document.getElementById('detail').style.display='flex';}
function addCartFromDetail(){if(!detailId) return; addCart(detailId); document.getElementById('detail').style.display='none';}
function addCart(id){cart[id]=(cart[id]||0)+1; if(cart[id]>produk[id].stok) cart[id]=produk[id].stok; updateCart();}
function updateCart(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0); const list=document.getElementById('cartList'); let total=0; list.innerHTML=Object.entries(cart).map(([id,q])=>{const p=produk[id]; if(!p) return ''; const sub=p.harga*q; total+=sub; return `<div class="flex gap-2 items-center border-b py-2"><img src="${p.foto||''}" class="w-10 h-10 object-cover rounded border"><div class="flex-1"><p class="font-bold text-[11px]">${p.nama}</p><p class="text-[10px]">x ${q} = Rp ${sub.toLocaleString()}</p></div><button onclick="delete cart['${id}']; updateCart()" class="text-red-600 text-[10px]">X</button></div>`;}).join('')||'<p class="text-[10px] text-slate-500">Kosong</p>'; document.getElementById('cartTotal').textContent='Rp '+total.toLocaleString('id-ID');}
function openCart(){document.getElementById('cart').style.display='flex'; updateCart();}
function checkoutWA(){const all=Object.entries(cart).map(([id,q])=>`${produk[id].nama} x ${q}`).join(', '); if(!all) return alert('Kosong'); window.open('https://wa.me/6281234567890?text='+encodeURIComponent('Pesan: '+all),'_blank');}

function render(){
 const q=(document.getElementById('q').value||'').toLowerCase(); const kat=document.getElementById('kat').value;
 const list=Object.entries(produk).filter(([id,p])=>{ if(kat && p.kat!==kat) return false; if(q && !p.nama.toLowerCase().includes(q)) return false; return true;});
 document.getElementById('gridToko').innerHTML=list.map(([id,p])=>`<div class="bg-white rounded-xl overflow-hidden border shadow-sm"><div class="h-[110px] bg-slate-100 flex items-center justify-center relative">${p.foto?`<img src="${p.foto}" class="w-full h-full object-cover">`:`<span class="text-[20px]">📦</span>`}<span class="absolute bottom-1 right-1 bg-[#BE1E2D] text-white text-[8px] px-2 py-0.5 rounded-full">Stok ${p.stok}</span></div><div class="p-2"><p class="font-bold text-[10px] truncate">${p.nama}</p><p class="font-black text-[#BE1E2D] text-[11px]">Rp ${Number(p.harga).toLocaleString('id-ID')}</p>${cur?.role==='admin_manajer' || cur?.role==='admin_karyawan'?`<div class="flex gap-1 mt-1"><button onclick="openAdd('${id}')" class="flex-1 bg-blue-600 text-white py-1 rounded-full text-[8px] font-bold">✏️ Edit</button><button onclick="hapusProd('${id}')" class="flex-1 bg-red-600 text-white py-1 rounded-full text-[8px] font-bold">🗑️ Hapus</button></div><div class="flex gap-1 mt-1"><button onclick="ubahStok('${id}',-1)" class="flex-1 bg-red-100 text-red-700 py-1 rounded-full text-[8px]">-1</button><button onclick="ubahStok('${id}',1)" class="flex-1 bg-green-600 text-white py-1 rounded-full text-[8px]">+1</button></div>`:''}</div></div>`).join('')||'<div class="col-span-2 bg-white p-6 rounded-xl text-center col-span-full"><p>📦</p><p class="text-[11px] mt-2 font-bold">Belum ada produk</p></div>';
 document.getElementById('gridBelanja').innerHTML=list.map(([id,p])=>`<div onclick="openDetail('${id}')" class="bg-white rounded-2xl overflow-hidden shadow border cursor-pointer"><div class="h-[150px] bg-slate-50 flex items-center justify-center relative">${p.foto?`<img src="${p.foto}" class="w-full h-full object-cover">`:`<span class="text-[36px]">🛒</span>`}<span class="absolute top-2 left-2 bg-white/90 px-2 py-0.5 rounded-full text-[8px] font-bold">${p.kat}</span></div><div class="p-3"><p class="font-bold text-[11px] truncate">${p.nama}</p><p class="font-black text-[#BE1E2D] text-[12px] mt-1">Rp ${Number(p.harga).toLocaleString('id-ID')}</p><p class="text-[9px] bg-slate-100 inline px-2 py-0.5 rounded-full mt-1">Stok ${p.stok}</p><button class="w-full mt-2 bg-[#BE1E2D] text-white py-2 rounded-full text-[9px] font-bold">Lihat & Beli</button></div></div>`).join('')||'<div class="col-span-full bg-white p-8 rounded-2xl text-center"><p class="text-[30px]">🛒</p><p class="font-bold text-[11px] mt-2">Katalog kosong</p></div>';
}
if(cur){document.getElementById('btnMasuk').style.display='none'; document.getElementById('btnKeluar').style.display='block'; afterLogin();}
render(); renderPengguna();
setTimeout(()=>{try{if(window.db){window.onValue(window.ref(window.db,'produk-katalog-V8'), s=>{const v=s.val()||{}; if(Object.keys(v).length>0){ if(Object.keys(v).length>=Object.keys(produk).length){localStorage.setItem('prodV8', JSON.stringify(v)); produk=v; render();}}}); window.onValue(window.ref(window.db,'users-katalog-V8'), s=>{const v=s.val()||{}; if(Object.keys(v).length>0){ if(Object.keys(v).length>=Object.keys(users).length){localStorage.setItem('usersV8', JSON.stringify(v)); users=v; ensureManajer(); renderPengguna();}}});}}catch(e){}},1000);
</script>
</body>
