<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERAI KDKMP - 7000764 FINAL</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fff5f5]">
<div class="bg-[#BE1E2D] text-white p-3 sticky top-0 z-10">
<div class="max-w-5xl mx-auto flex justify-between items-center">
<b>GERAI KDKMP KASIH 53354</b>
<div class="flex gap-2">
<span id="badge" class="hidden bg-white text-[#BE1E2D] px-2 py-1 rounded-full text-[9px] font-black"></span>
<button onclick="document.getElementById('auth').style.display='flex'" class="bg-white text-[#BE1E2D] px-4 py-2 rounded-full text-[12px] font-bold">Masuk / Daftar</button>
<button id="out" onclick="logout()" class="hidden bg-black/30 px-3 py-2 rounded-full text-[10px]">Keluar</button>
</div>
</div>
</div>

<div class="max-w-5xl mx-auto p-3">
<div class="bg-white rounded-xl p-3 flex gap-2 mb-3">
<input id="q" oninput="render()" placeholder="Cari beras, minyak, gula..." class="flex-1 border rounded-full px-4 py-2 text-[12px]">
<button id="addBtn" onclick="document.getElementById('add').style.display='flex'" class="hidden bg-[#BE1E2D] text-white px-4 py-2 rounded-full text-[11px] font-bold">+ Produk</button>
</div>
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
</div>

<!-- LOGIN MODAL -->
<div id="auth" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:16px">
<div class="bg-white rounded-2xl w-full max-w-sm p-5">
<div class="flex justify-between"><b class="text-[#BE1E2D]" id="tAuth">Masuk</b><button onclick="document.getElementById('auth').style.display='none'" class="bg-slate-100 w-8 h-8 rounded-full">X</button></div>
<div class="mt-4 space-y-3">
<input id="aNama" placeholder="Nama Lengkap" style="display:none" class="w-full border-2 rounded-full px-4 py-3 text-[13px]">
<input id="aEmail" placeholder="Email / username" class="w-full border-2 rounded-full px-4 py-3 text-[13px]">
<input id="aPass" type="password" placeholder="Password min 4" class="w-full border-2 rounded-full px-4 py-3 text-[13px]">
<input id="aKode" placeholder="Kode Admin KASIH53354" style="display:none" class="w-full border-2 border-amber-300 bg-amber-50 rounded-full px-4 py-3 text-[11px]">
<p id="aMsg" class="text-red-600 text-[11px] text-center"></p>
<button onclick="doAuth()" class="w-full bg-[#BE1E2D] text-white py-3 rounded-full font-black">PROSES</button>
<button onclick="switchMode()" class="w-full bg-slate-100 py-3 rounded-full text-[11px] font-bold"><span id="aSw">Belum punya? Daftar</span></button>
</div>
</div>
</div>

<!-- ADD MODAL -->
<div id="add" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99998;align-items:center;justify-content:center;padding:16px">
<div class="bg-white rounded-2xl w-full max-w-sm p-5"><div class="flex justify-between"><b>Tambah Produk</b><button onclick="document.getElementById('add').style.display='none'" class="bg-slate-100 w-7 h-7 rounded-full">X</button></div>
<div class="mt-3 space-y-2">
<input id="pNama" placeholder="Nama ex: Beras 5kg" class="w-full border rounded-xl px-3 py-2 text-[11px]">
<input id="pHarga" type="number" placeholder="Harga" class="w-full border rounded-xl px-3 py-2 text-[11px]">
<input id="pStok" type="number" placeholder="Stok" class="w-full border rounded-xl px-3 py-2 text-[11px]">
<select id="pKat" class="w-full border rounded-xl px-3 py-2 text-[11px]"><option>Sembako</option><option>Beras</option><option>Minyak</option><option>Gula</option><option>Mie</option><option>Minuman</option><option>Lainnya</option></select>
<button onclick="saveProd()" class="w-full bg-[#BE1E2D] text-white py-2.5 rounded-full font-bold text-[11px]">Simpan</button>
</div></div>
</div>

<script type="module">
// CONFIG PERSIS YANG KAMU KIRIM
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBP1lvYR22XOf-IC_34gHEEkfolSthDTzo",
  authDomain: "kasih-kopdes.firebaseapp.com",
  databaseURL: "https://kasih-kopdes-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kasih-kopdes",
  storageBucket: "kasih-kopdes.firebasestorage.app",
  messagingSenderId: "746954171317",
  appId: "1:746954171317:web:7000764fc695b1b1ce2ffc",
  measurementId: "G-X1JQ7P97X9"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
window.db=db; window.ref=ref; window.set=set; window.onValue=onValue; window.update=update; window.remove=remove;
</script>

<script>
let mode='login';
let produk=JSON.parse(localStorage.getItem('prodV5')||'{}');
let users=JSON.parse(localStorage.getItem('usersV5')||'{}');
let cur=JSON.parse(localStorage.getItem('curV5')||'null');
function hash(p){let h=0;for(let i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0;}return 'h'+Math.abs(h)+btoa(p).slice(0,4);}
function switchMode(){mode=mode==='login'?'register':'login'; document.getElementById('tAuth').textContent=mode==='login'?'Masuk':'Daftar'; document.getElementById('aSw').textContent=mode==='login'?'Belum punya? Daftar':'Sudah punya? Masuk'; document.getElementById('aNama').style.display=mode==='login'?'none':'block'; document.getElementById('aKode').style.display=mode==='login'?'none':'block';}
function doAuth(){
 const email=document.getElementById('aEmail').value.trim().toLowerCase();
 const pass=document.getElementById('aPass').value.trim();
 const nama=document.getElementById('aNama').value.trim();
 const kode=document.getElementById('aKode').value.trim();
 const msg=document.getElementById('aMsg');
 if(!email||!pass){msg.textContent='Isi email & password';return;}
 if(pass.length<4){msg.textContent='Password min 4';return;}
 if(mode==='register'){
  if(!nama){msg.textContent='Isi nama';return;}
  if(Object.values(users).find(u=>u.email===email)){msg.textContent='Email sudah ada';return;}
  let role='pembeli'; if(kode){ if(kode==='KASIH53354') role='admin'; else {msg.textContent='Kode admin salah';return;} }
  const id=Date.now().toString();
  users[id]={id,email,nama,passHash:hash(pass),role};
  localStorage.setItem('usersV5', JSON.stringify(users));
  try{ if(window.db) window.set(window.ref(window.db,'users-katalog-V5/'+id), users[id]); }catch(e){}
  msg.textContent='Sukses daftar '+role+'! Sekarang Masuk';
  mode='login'; switchMode();
 } else {
  const f=Object.values(users).find(u=>u.email===email && u.passHash===hash(pass));
  if(!f){msg.textContent='Salah email/pass';return;}
  cur=f; localStorage.setItem('curV5', JSON.stringify(cur));
  document.getElementById('auth').style.display='none';
  afterLogin();
 }
}
function afterLogin(){
 document.getElementById('badge').classList.remove('hidden'); document.getElementById('badge').textContent=cur.role.toUpperCase();
 document.getElementById('out').classList.remove('hidden');
 if(cur.role==='admin') document.getElementById('addBtn').classList.remove('hidden');
 render();
}
function logout(){localStorage.removeItem('curV5'); location.reload();}
function saveProd(){
 const nama=document.getElementById('pNama').value.trim();
 const harga=parseInt(document.getElementById('pHarga').value)||0;
 const stok=parseInt(document.getElementById('pStok').value)||0;
 const kat=document.getElementById('pKat').value;
 if(!nama||!harga) return alert('Isi nama & harga');
 const id=Date.now().toString();
 produk[id]={nama,harga,stok,kat};
 localStorage.setItem('prodV5', JSON.stringify(produk));
 try{ if(window.db) window.set(window.ref(window.db,'produk-katalog-V5/'+id), produk[id]); }catch(e){}
 document.getElementById('add').style.display='none';
 render();
}
function ubah(id,d){produk[id].stok=(produk[id].stok||0)+d; if(produk[id].stok<0) produk[id].stok=0; localStorage.setItem('prodV5', JSON.stringify(produk)); try{ if(window.db) window.update(window.ref(window.db,'produk-katalog-V5/'+id), {stok:produk[id].stok}); }catch(e){} render();}
function hapus(id){if(!confirm('Hapus?'))return; delete produk[id]; localStorage.setItem('prodV5', JSON.stringify(produk)); try{ if(window.db) window.remove(window.ref(window.db,'produk-katalog-V5/'+id)); }catch(e){} render();}
function render(){
 const q=(document.getElementById('q').value||'').toLowerCase();
 const grid=document.getElementById('grid');
 const list=Object.entries(produk).filter(([id,p])=>!q||p.nama.toLowerCase().includes(q));
 if(list.length===0){grid.innerHTML='<div class="col-span-2 bg-white p-6 rounded-xl text-center"><p>📦</p><p class="font-bold text-[11px] mt-2">Belum ada produk</p></div>'; return;}
 grid.innerHTML=list.map(([id,p])=>`<div class="bg-white rounded-xl p-3 border"><p class="font-bold text-[11px]">${p.nama}</p><p class="text-[9px] text-slate-500">${p.kat}</p><p class="font-black text-[#BE1E2D] text-[13px] mt-1">Rp ${Number(p.harga).toLocaleString('id-ID')}</p><p class="text-[10px]">Stok: <b>${p.stok}</b></p>${cur?.role==='admin'?`<div class="flex gap-1 mt-2"><button onclick="ubah('${id}',-1)" class="bg-red-600 text-white px-2 py-1 rounded-full text-[9px]">-1</button><button onclick="ubah('${id}',1)" class="bg-green-600 text-white px-2 py-1 rounded-full text-[9px]">+1</button><button onclick="hapus('${id}')" class="bg-slate-100 px-2 py-1 rounded-full text-[9px]">Hapus</button></div>`:''}</div>`).join('');
}
if(cur) afterLogin();
render();
// sync dari firebase
setTimeout(()=>{try{if(window.db){window.onValue(window.ref(window.db,'produk-katalog-V5'), s=>{const v=s.val()||{}; if(Object.keys(v).length>0){localStorage.setItem('prodV5', JSON.stringify(v)); produk=v; render();}}); window.onValue(window.ref(window.db,'users-katalog-V5'), s=>{const v=s.val()||{}; if(Object.keys(v).length>0){localStorage.setItem('usersV5', JSON.stringify(v)); users=v;}});}}catch(e){}},1000);
</script>
</body>
</html>
