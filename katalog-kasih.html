<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KATALOG KDKMP KASIH V20 RESET - kasih-kopdes</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-[#fff8f8]">
<div class="bg-[#BE1E2D] text-white p-4 sticky top-0 z-40">
<div class="max-w-7xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-[60px] h-[60px] bg-white rounded-full flex items-center justify-center text-[#BE1E2D] font-black text-[28px]">K</div>
<div><p class="font-black">GERAI KDKMP KASIH V20</p><p class="text-[10px]"><span id="syncStatus" class="bg-yellow-300 text-black px-2 py-0.5 rounded-full">RESET & SYNC kasih-kopdes</span></p></div>
</div>
<div class="flex gap-1 items-center">
<span id="badge" class="hidden bg-white text-[#BE1E2D] px-3 py-1 rounded-full text-[10px] font-black"></span>
<button id="btnMasuk" class="bg-white text-[#BE1E2D] px-5 py-2 rounded-full text-[12px] font-black shadow">Masuk</button>
<button id="btnKeluar" style="display:none" class="bg-black/40 px-4 py-2 rounded-full text-[11px] font-bold">Keluar</button>
</div>
</div>
<div class="max-w-7xl mx-auto mt-3 flex gap-2">
<input id="q" placeholder="Cari produk..." class="flex-1 rounded-full px-5 py-3 text-[14px] text-black shadow">
<select id="kat" class="rounded-full px-4 py-3 text-[12px] text-black shadow"><option value="">Semua</option><option>Sembako</option><option>Beras</option><option>Minyak</option><option>Gula</option><option>Mie</option><option>Minuman</option><option>Bundling</option><option>Promo</option><option>Lainnya</option></select>
<button id="addBtn" style="display:none" class="bg-white text-[#BE1E2D] px-5 py-3 rounded-full text-[12px] font-bold shadow">+ Produk</button>
<button id="cartBtn" class="bg-white text-[#BE1E2D] px-5 py-3 rounded-full text-[12px] font-bold shadow">Keranjang <span id="cartCount">0</span></button>
</div>
</div>

<div class="max-w-7xl mx-auto p-4">
<div class="bg-green-50 border-2 border-green-400 rounded-xl p-3 mb-4 text-[11px] text-center">
<b>✅ V20 RESET - Login Pasti Bisa</b><br>
Username: <b>Admin Manajer</b> | Password: <b>Manajer0k3</b><br>
<span class="text-[9px]">Kalau salah, klik tombol Reset di bawah</span><br>
<button onclick="resetTotal()" class="mt-2 bg-red-600 text-white px-4 py-2 rounded-full text-[10px] font-bold">🔄 RESET TOTAL & BUAT MANAJER BARU</button>
</div>
<div id="viewToko" style="display:none"><h2 class="font-black text-[14px] text-[#BE1E2D] mb-3">🏪 Toko</h2><div id="gridToko" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div></div>
<div id="viewBelanja"><div id="gridBelanja" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div></div>
</div>

<div id="auth" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99998;align-items:center;justify-content:center;padding:16px"><div class="bg-white rounded-2xl w-full max-w-sm p-5"><div class="flex justify-between"><b>Login V20</b><button class="btnClose bg-slate-100 w-8 h-8 rounded-full">X</button></div><div class="bg-yellow-50 border rounded p-2 mt-3 text-[10px]">Username: <b>Admin Manajer</b><br>Password: <b>Manajer0k3</b></div><div class="mt-4 space-y-3"><input id="lUser" placeholder="Admin Manajer" class="w-full border-2 rounded-full px-4 py-3 text-[13px]"><input id="lPass" type="password" placeholder="Manajer0k3" class="w-full border-2 rounded-full px-4 py-3 text-[13px]"><p id="lMsg" class="text-red-600 text-[11px] text-center"></p><button id="doLoginBtn" class="w-full bg-[#BE1E2D] text-white py-3 rounded-full font-black">MASUK SEKARANG</button></div></div></div>
<div id="add" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99997;align-items:center;justify-content:center;padding:16px"><div class="bg-white rounded-2xl w-full max-w-md p-5"><div class="flex justify-between"><b>Produk</b><button class="btnClose bg-slate-100 w-7 h-7 rounded-full">X</button></div><div class="mt-3 space-y-2"><input id="pNama" placeholder="Nama" class="w-full border rounded-xl px-3 py-2 text-[11px]"><div class="grid grid-cols-2 gap-2"><input id="pHarga" type="number" placeholder="Harga" class="border rounded-xl px-3 py-2 text-[11px]"><input id="pStok" type="number" placeholder="Stok" class="border rounded-xl px-3 py-2 text-[11px]"></div><select id="pKat" class="w-full border rounded-xl px-3 py-2 text-[11px]"><option>Sembako</option><option>Beras</option><option>Minyak</option><option>Gula</option><option>Mie</option><option>Minuman</option><option>Bundling</option><option>Promo</option><option>Lainnya</option></select><label class="flex gap-2 text-[11px] items-center"><input type="checkbox" id="pIsPromo"> Promo</label><input type="file" id="pFoto" accept="image/*" class="w-full text-[10px]"><div id="prevBox" class="hidden mt-2"><img id="prevImg" class="w-full h-40 object-contain border rounded-xl"></div><button id="saveProdBtn" class="w-full bg-[#BE1E2D] text-white py-2.5 rounded-full font-bold text-[11px]">💾 SIMPAN KE FIREBASE</button></div></div></div>
<div id="cart" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99995;align-items:center;justify-content:center;padding:16px"><div class="bg-white rounded-2xl w-full max-w-md p-5 max-h-[90vh] overflow-auto"><div class="flex justify-between"><b>Keranjang</b><button class="btnClose bg-slate-100 w-7 h-7 rounded-full">X</button></div><div id="cartList" class="mt-3 space-y-2"></div><div class="flex justify-between font-black text-[14px] border-t pt-2 mt-3"><span>Total:</span><span id="cartTotal">Rp 0</span></div><button id="checkoutBtn" class="w-full mt-4 bg-green-600 text-white py-3 rounded-full font-bold">✅ Checkout</button></div></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBP1lvYR22XOf-IC_34gHEEkfolSthDTzo",
    authDomain: "kasih-kopdes.firebaseapp.com",
    databaseURL: "https://kasih-kopdes-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "kasih-kopdes",
    storageBucket: "kasih-kopdes.firebasestorage.app",
    messagingSenderId: "746954171317",
    appId: "1:746954171317:web:7000764fc695b1b1ce2ffc",
    measurementId: "G-X1JQ7P97X9"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window.db=db; window.ref=ref; window.set=set; window.onValue=onValue; window.remove=remove;
  
  // LISTEN - SYNC OTOMATIS
  onValue(ref(db, 'produk-kdkmp-final'), snap=>{
    const val=snap.val();
    if(val){ localStorage.setItem('produk-kdkmp-final', JSON.stringify(val)); if(window.render) window.render(); }
    document.getElementById('syncStatus').textContent='✅ SYNC AKTIF - kasih-kopdes';
  });
  onValue(ref(db, 'users-kdkmp-final'), snap=>{
    const val=snap.val();
    if(val && Object.keys(val).length>0){
      localStorage.setItem('users-kdkmp-final', JSON.stringify(val));
    }
  });
</script>

<script>
function hash(p){let h=0;for(let i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0;}return 'h'+Math.abs(h)+btoa(p).slice(0,4);}
const KEY_PROD='produk-kdkmp-final', KEY_USERS='users-kdkmp-final', KEY_ORDERS='orders-kdkmp-final';
let produk=JSON.parse(localStorage.getItem(KEY_PROD)||'{}');
let users=JSON.parse(localStorage.getItem(KEY_USERS)||'{}');
let cart={}; let editId=null; let tempFoto=null;
let cur=JSON.parse(localStorage.getItem('curV14')||'null');

function resetTotal(){
  if(!confirm('Reset total? Semua produk & user akan dibuat ulang, tapi Manajer pasti bisa login')) return;
  const id='admin_manajer_001';
  const manajer={id,nama:'Admin Manajer',kontak:'Admin Manajer',alamat:'Kantor',passHash:hash('Manajer0k3'),role:'admin_manajer',totalBelanja:0,createdAt:new Date().toISOString()};
  users={}; users[id]=manajer;
  localStorage.setItem(KEY_USERS, JSON.stringify(users));
  localStorage.setItem(KEY_PROD, JSON.stringify({}));
  localStorage.removeItem('curV14');
  if(window.db && window.set && window.ref){
    window.set(window.ref(window.db,'users-kdkmp-final/'+id), manajer);
    window.set(window.ref(window.db,'produk-kdkmp-final'), {});
  }
  alert('✅ RESET SELESAI\nUsername: Admin Manajer\nPassword: Manajer0k3\n\nSilakan login sekarang');
  location.reload();
}

function ensureManajer(){
  const id='admin_manajer_001';
  if(!users[id]){
    const manajer={id,nama:'Admin Manajer',kontak:'Admin Manajer',alamat:'Kantor',passHash:hash('Manajer0k3'),role:'admin_manajer',totalBelanja:0,createdAt:new Date().toISOString()};
    users[id]=manajer;
    localStorage.setItem(KEY_USERS, JSON.stringify(users));
    if(window.db && window.set && window.ref){
      window.set(window.ref(window.db,'users-kdkmp-final/'+id), manajer);
    }
    console.log('Manajer dibuat:', hash('Manajer0k3'));
  }
}
ensureManajer();

function closeAll(){document.querySelectorAll('#auth,#add,#cart').forEach(el=>el.style.display='none');}
document.querySelectorAll('.btnClose').forEach(b=>b.addEventListener('click', closeAll));

function afterLogin(){
  document.getElementById('badge').classList.remove('hidden');
  document.getElementById('badge').textContent=cur.role.toUpperCase();
  document.getElementById('btnMasuk').style.display='none';
  document.getElementById('btnKeluar').style.display='block';
  document.getElementById('addBtn').style.display='block';
  render();
}
function doLogin(){
  users=JSON.parse(localStorage.getItem(KEY_USERS)||'{}');
  const u=document.getElementById('lUser').value.trim();
  const p=document.getElementById('lPass').value.trim();
  console.log('Coba login:', u, 'hash:', hash(p));
  const found=Object.values(users).find(x=>(x.nama.toLowerCase()===u.toLowerCase()||(x.kontak||'').toLowerCase()===u.toLowerCase())&&x.passHash===hash(p));
  if(!found){
    document.getElementById('lMsg').textContent='Salah! Pastikan Admin Manajer / Manajer0k3 - Hash kamu: '+hash(p)+' - Hash benar: '+hash('Manajer0k3')+' - User ada: '+Object.keys(users).length;
    return;
  }
  cur=found;
  localStorage.setItem('curV14', JSON.stringify(cur));
  closeAll(); afterLogin();
}
function render(){
  produk=JSON.parse(localStorage.getItem(KEY_PROD)||'{}');
  const q=(document.getElementById('q').value||'').toLowerCase(); const kat=document.getElementById('kat').value;
  const list=Object.entries(produk).filter(([id,p])=>{ if(kat&&p.kat!==kat) return false; if(q&&!p.nama.toLowerCase().includes(q)) return false; return true;});
  document.getElementById('gridBelanja').innerHTML=list.map(([id,p])=>`<div class="bg-white rounded-2xl overflow-hidden shadow border"><div class="h-[160px] bg-white flex items-center justify-center"><img src="${p.foto||''}" class="w-full h-full object-contain"></div><div class="p-3"><p class="font-bold text-[12px]">${p.nama}</p><p class="font-black text-[#BE1E2D]">Rp ${p.harga.toLocaleString('id-ID')}</p><button onclick="addCart('${id}')" class="w-full mt-2 bg-[#BE1E2D] text-white py-2 rounded-full text-[10px]">+ Keranjang</button></div></div>`).join('')||'<div class="col-span-full bg-white p-8 rounded-2xl text-center">Belum ada produk<br><span class="text-[10px]">Login sebagai Admin Manajer untuk tambah produk</span></div>';
}
function openAdd(id=null){editId=id; document.getElementById('add').style.display='flex';}
document.getElementById('pFoto')?.addEventListener('change', function(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');let w=im.width,h=im.height;const max=800;if(w>max||h>max){const ratio=Math.min(max/w,max/h);w=w*ratio;h=h*ratio;}c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);tempFoto=c.toDataURL('image/jpeg',0.8);document.getElementById('prevImg').src=tempFoto;document.getElementById('prevBox').classList.remove('hidden');};im.src=ev.target.result;};r.readAsDataURL(file);});
function saveProd(){
  const nama=document.getElementById('pNama').value.trim();const harga=parseInt(document.getElementById('pHarga').value)||0;const stok=parseInt(document.getElementById('pStok').value)||0;const kat=document.getElementById('pKat').value;
  if(!nama||!harga)return alert('Isi nama & harga');
  const id=editId||Date.now().toString();
  const prod={nama,harga,stok,kat,foto:tempFoto||produk[id]?.foto||null,updatedAt:Date.now()};
  produk=JSON.parse(localStorage.getItem(KEY_PROD)||'{}'); produk[id]=prod;
  localStorage.setItem(KEY_PROD, JSON.stringify(produk));
  if(window.db) window.set(window.ref(window.db,'produk-kdkmp-final/'+id), prod);
  closeAll(); render();
}
function addCart(id){cart[id]=(cart[id]||0)+1; document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0);}
document.getElementById('btnMasuk').addEventListener('click',()=>{document.getElementById('auth').style.display='flex';});
document.getElementById('btnKeluar').addEventListener('click',()=>{localStorage.removeItem('curV14');location.reload();});
document.getElementById('doLoginBtn').addEventListener('click',doLogin);
document.getElementById('saveProdBtn').addEventListener('click',saveProd);
document.getElementById('q').addEventListener('input',render);
document.getElementById('kat').addEventListener('change',render);

if(cur){ afterLogin(); }
render();
</script>
</body>
</html>
